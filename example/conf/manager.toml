# Buz Manager Configuration

[server]
host = "0.0.0.0"
port = 8080

# ── TLS (recommended for production) ──
# Uncomment to enable HTTPS. Generate a self-signed cert:
#   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=localhost"
# tls_cert = "certs/cert.pem"
# tls_key  = "certs/key.pem"

[database]
path = "./data/buz.db"
max_connections = 8

[auth]
# Demo defaults only — change before any shared/production deploy.
# export BUZ_JWT_SECRET=$(openssl rand -base64 32)
jwt_secret = "changeme-demo-only"
admin_user = "admin"
admin_password = "changeme-demo-only"
runner_register_token_ttl_hours = 24
jwt_ttl_hours = 24

[runner]
heartbeat_timeout_seconds = 90
long_poll_timeout_seconds = 45

[pipeline]
yaml_scan_dir = "./pipelines"
yaml_scan_interval_seconds = 30
