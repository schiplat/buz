# Buz Manager — example / local demo config
#
# Production: set a strong jwt_secret (or BUZ_JWT_SECRET).
# First admin is created in the web UI at /setup (no password in this file).

# Public plugin-marketplace URL linked from the Dashboard's YAML editor.
# Override for internal-mirror or air-gapped deployments (env: BUZ_MARKETPLACE_URL).
# marketplace_url = "https://plugins.example.com"

[server]
host = "0.0.0.0"
port = 8080
# tls_cert = "certs/cert.pem"
# tls_key  = "certs/key.pem"
# Public UI origin for notify deep links (View Job → /jobs/{id}).
# Example: "https://buz.example.com"  (trailing slash optional)
# public_base_url = "http://127.0.0.1:8080"

[database]
path = "./data/buz.db"
max_connections = 8

[auth]
# Local demo only. Manager refuses this unless BUZ_ALLOW_INSECURE_JWT=1
# (Makefile `run` / `dev-manager` set that). Prefer: export BUZ_JWT_SECRET="$(openssl rand -hex 32)"
jwt_secret = "changeme-demo-only"
# JWT lifetime for UI/API users and runner session tokens after register
jwt_ttl_hours = 24
# Lifetime of the JWT issued at runner registration (runner→manager auth)
runner_register_token_ttl_hours = 24

[runner]
# Mark runner offline when no heartbeat for this many seconds
heartbeat_timeout_seconds = 90

[pipeline]
# File/Git authority for pipelines (mount or sync a repo here).
# UI Save writes .yml into this dir and upserts the DB projection immediately;
# the scanner also picks up external Git/FS edits on this interval.
yaml_scan_dir = "./pipelines"
yaml_scan_interval_seconds = 30

["*.aliyuncs.com"]

[logging]
level = "info"
# file = "./logs/manager.log"

