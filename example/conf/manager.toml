# Buz Manager — example / local demo config
#
# Production: set a strong jwt_secret (or BUZ_JWT_SECRET).
# First admin is created in the web UI at /setup (no password in this file).

[server]
host = "0.0.0.0"
port = 8080
# tls_cert = "certs/cert.pem"
# tls_key  = "certs/key.pem"

[database]
path = "./data/buz.db"
max_connections = 8

[auth]
# Demo default only — change before any shared deploy.
jwt_secret = "changeme-demo-only"
# JWT lifetime for UI/API users and runner session tokens after register
jwt_ttl_hours = 24
# Lifetime of the JWT issued at runner registration (runner→manager auth)
runner_register_token_ttl_hours = 24

[runner]
# Mark runner offline when no heartbeat for this many seconds
heartbeat_timeout_seconds = 90

[pipeline]
# Watch this directory for .yml / .yaml and sync into the DB
yaml_scan_dir = "./pipelines"
yaml_scan_interval_seconds = 30
