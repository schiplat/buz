# Buz Manager — example / local demo config
#
# Production: set a strong jwt_secret (or BUZ_JWT_SECRET).
# First admin is created in the web UI at /setup (no password in this file).

[server]
host = "0.0.0.0"
port = 8080
# tls_cert = "certs/cert.pem"
# tls_key  = "certs/key.pem"
# Public UI origin for notify deep links (View Job → /jobs/{id}).
# Example: "https://buz.example.com"  (trailing slash optional)
# public_base_url = "http://127.0.0.1:8080"

[database]
path = "./data/buz.db"
max_connections = 8

[auth]
# Local demo only. Manager refuses this unless BUZ_ALLOW_INSECURE_JWT=1
# (Makefile `run` / `dev-manager` set that). Prefer: export BUZ_JWT_SECRET="$(openssl rand -hex 32)"
jwt_secret = "changeme-demo-only"
# JWT lifetime for UI/API users and runner session tokens after register
jwt_ttl_hours = 24
# Lifetime of the JWT issued at runner registration (runner→manager auth)
runner_register_token_ttl_hours = 24

[runner]
# Mark runner offline when no heartbeat for this many seconds
heartbeat_timeout_seconds = 90

[pipeline]
# File/Git authority for pipelines (mount or sync a repo here).
# UI Save writes .yml into this dir and upserts the DB projection immediately;
# the scanner also picks up external Git/FS edits on this interval.
yaml_scan_dir = "./pipelines"
yaml_scan_interval_seconds = 30

[step_index]
# Empty local_dir → <yaml_scan_dir>/steps (./pipelines/steps).
# To use an external Git mirror, point this at its plugins/ directory.
# local_dir = "/opt/buz-plugin-mirror/plugins"
# Validate with: buz-manager step-validate /opt/buz-plugin-mirror/plugins
# Review badge (ADR §6.7.4): reviewed_manifest = "/etc/buz/reviews.json"
# require_reviewed = false

[clock]
# Signed config URLs (config.source → OSS) embed an absolute expiry, so a slow
# Manager clock signs URLs that are already expired on arrival
# (OSS: 403 AccessDenied "Request has expired"). The Manager probes the OSS
# endpoint's Date header before signing and refuses with an actionable error.
# Real fix: sync the host clock (NTP).
# enabled = true
# warn_threshold_seconds = 60
# cache_ttl_seconds = 300
# Hosts the guard may probe. The target comes from a team-scoped config_source
# secret (https://{bucket}.{endpoint}/), so this allowlist is what stops a
# secret owner from aiming the Manager's HTTP client at an internal host
# (SSRF). Hosts outside it are never contacted (guard skipped); port 443 is
# implied unless an entry names one ("minio.internal:9000"); an empty list
# disables probing. Redirects are never followed.
# allowed_hosts = ["*.aliyuncs.com"]

[logging]
level = "info"
# file = "./logs/manager.log"

[step_index]
# Local YAML specs for `uses:` references. Empty → <yaml_scan_dir>/steps.
# For Docker, mount an external mirror's plugins/ directory and set
# BUZ_STEP_INDEX__LOCAL_DIR to its container path. Manager does not clone/sync it.
# Optional local override outside Docker:
# local_dir = "/opt/buz-plugin-mirror/plugins"
# Validate with: buz-manager step-validate /opt/buz-plugin-mirror/plugins
# reviewed_manifest = "/etc/buz/reviews.json"
# require_reviewed = false
