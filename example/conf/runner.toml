# Buz Runner Configuration

[manager]
# Use https:// when the Manager has TLS enabled
url = "http://127.0.0.1:8080"
# Get this token from Buz Manager web UI → Runners → New Runner
# Do not commit real tokens — replace locally after creating a runner.
register_token = "your-register-token"

# ── TLS (required when Manager uses HTTPS) ──
# Set to true only if the Manager uses a self-signed certificate.
# In production, use a CA-signed certificate and keep this false.
# tls_skip_verify = false

[runner]
name = "demo-n1"
labels = ["macos-armx64"]
work_dir = "/tmp/buz-runner"
# Multi-NIC: IPs from these interfaces appear first in Manager Runners UI.
# When empty, prefer IPs on the same subnet as manager.url.
# prefer_interfaces = ["enp26s0"]

# ── Ephemeral / workspace cleanup ──
# clean_workspace_after_job = true   # wipe work_dir after each job (shared runners)
# ephemeral = true                   # wipe work_dir AND exit after one job (container/VM runners)

[engine]
local_enabled = true
ssh_enabled = true
docker_enabled = true   # set true to accept uses: docker steps (see docs/docker-engine)
wasm_enabled = false
# Host key policy: "insecure" (default, accept any) or "known_hosts"
# ssh_host_key_policy = "known_hosts"
# ssh_known_hosts_path = "/home/runner/.ssh/known_hosts"  # default: ~/.ssh/known_hosts
