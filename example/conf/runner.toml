# Buz Runner — machine-local config only
#
# Strategy (labels, concurrency, engines, cleanup) → Manager UI → Runners.

[runner]
name = "lab-runner-01"
manager_url = "http://127.0.0.1:8080"
# From Manager UI → Runners → New Runner (do not commit real tokens)
register_token = "REPLACE_WITH_UI_REGISTER_TOKEN"
# tls_skip_verify = true
workspace_dir = "/tmp/buz-runner"
# New deployments should opt into strict host-mount restrictions. Existing
# deployments default to legacy until explicitly migrated.
docker_mount_policy = "strict"
# Grant only on a dedicated Runner whose jobs are trusted to control this daemon.
docker_socket_allowed = false
docker_socket_path = "/var/run/docker.sock"
token_cache_path = "./state/runner-token"
# prefer_interfaces = ["enp26s0"]

[engine]
# ssh_known_hosts_path = "~/.ssh/known_hosts"
# Scope the Docker CLI config (docker login credentials) to the job workspace.
# per_job (default): {workspace}/{job}/.docker, removed when the job ends.
# shared: legacy host-global ~/.docker/config.json (credential-store setups).
# docker_config_isolation = "per_job"

[clock]
# Startup check: this Runner's clock vs the Manager's (probed via the Manager
# `Date` header, then re-checked on every heartbeat). Skew beyond
# max_skew_seconds aborts startup — sync the host clock (NTP) instead of
# relaxing it; labs only: fail_on_skew = false.
# enabled = true
# warn_threshold_seconds = 60
# max_skew_seconds = 300

[logging]
level = "info"
file = "./logs/runner.log"
