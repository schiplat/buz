# Buz Runner — machine-local config only
#
# Strategy (labels, concurrency, engines, cleanup) → Manager UI → Runners.

[runner]
name = "macos-kit-01"
manager_url = "http://127.0.0.1:8080"
# From Manager UI → Runners → New Runner (do not commit real tokens)
register_token = "REPLACE_WITH_UI_REGISTER_TOKEN"
# tls_skip_verify = true
workspace_dir = "/tmp/buz-runner"
# prefer_interfaces = ["enp26s0"]

[engine]
# ssh_known_hosts_path = "~/.ssh/known_hosts"

[logging]
level = "info"
file = "./logs/runner.log"
