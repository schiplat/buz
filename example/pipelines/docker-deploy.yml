# ── Docker Deploy Pipeline ──────────────────────────────────────
# Deploy a Docker container to staging / production
#
# Trigger: manual (with inputs) or webhook
# Registry credentials: add a login step (buz/docker-login template or inline
# docker login) when credentials are needed (Team share OFF by default).
#
# Run blocks: $INPUT_<KEY>. host: field: $target (trigger input name, not $INPUT_TARGET).

name: Docker Deploy
environments: [default]
description: Build, push, and deploy a Docker container to target environment.

team: default

on:
  manual:
    inputs:
      service:
        description: Service name to deploy
        required: true
        type: string  
      tag:
        description: Image tag (e.g. 1.2.0)
        required: true
        default: latest
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
      target:
        description: Target host name (must exist in Hosts)
        required: false
        default: staging
        type: string

runner:
  labels: [linux-x64]
  timeout: 15m

env:
  REGISTRY: registry.example.com
  NAMESPACE: apps

steps:
  # ── Step 1: Pull latest code ──────────────────────────────────────
  - name: Checkout
    run: |
      echo "Preparing deploy for $INPUT_SERVICE:$INPUT_TAG"
      echo "Target: $INPUT_TARGET"
      echo "Registry: $REGISTRY/$NAMESPACE"

  # ── Step 2: Build Docker image ────────────────────────────────────
  - name: Build
    run: docker build -t "$REGISTRY/$NAMESPACE/$INPUT_SERVICE:$INPUT_TAG" -f Dockerfile .
    timeout: 10m

  # ── Step 3: Push to registry ──────────────────────────────────────
  - name: Push
    run: docker push "$REGISTRY/$NAMESPACE/$INPUT_SERVICE:$INPUT_TAG"
    timeout: 5m

  # ── Step 4: Deploy via SSH ────────────────────────────────────────
  - name: Deploy
    engine: ssh
    host: $target
    run: |
      docker pull "$REGISTRY/$NAMESPACE/$INPUT_SERVICE:$INPUT_TAG"
      docker stop "$INPUT_SERVICE" || true
      docker rm "$INPUT_SERVICE" || true
      docker run -d --name "$INPUT_SERVICE" \
        --restart always \
        -p 3000:3000 \
        "$REGISTRY/$NAMESPACE/$INPUT_SERVICE:$INPUT_TAG"
    timeout: 5m

  # ── Step 5: Health check (non-blocking) ───────────────────────────
  - name: Health Check
    engine: ssh
    host: $target
    run: |
      sleep 3
      curl -f http://localhost:3000/health && echo "OK" || echo "HEALTH_CHECK_FAILED"
    continue-on-error: true
    timeout: 30s

  # ── Step 6: Notification ──────────────────────────────────────────
  - name: Notify
    run: |
      echo "Deploy complete: $INPUT_SERVICE -> $INPUT_TAG on $INPUT_TARGET"
