# ── Docker Deploy Pipeline ──────────────────────────────────────
# Deploy a Docker container to staging / production
#
# Trigger: manual (with inputs) or webhook
# Add secrets: / registry_secret when credentials are needed (Team share OFF by default).

name: Docker Deploy
description: Build, push, and deploy a Docker container to target environment.

team: default

on:
  manual:
    inputs:
      service:
        description: Service name to deploy
        required: true
      tag:
        description: Image tag (e.g. 1.2.0)
        required: true
        default: latest
      target:
        description: Target host label
        required: false
        default: staging

runner:
  labels: [linux-x64]
  timeout: 15m

env:
  REGISTRY: registry.example.com
  NAMESPACE: apps

steps:
  # ── Step 1: Pull latest code ──────────────────────────────────────
  - name: Checkout
    run: |
      echo "Preparing deploy for $service:$tag"
      echo "Target: $target"
      echo "Registry: $REGISTRY/$NAMESPACE"

  # ── Step 2: Build Docker image ────────────────────────────────────
  - name: Build
    run: docker build -t $REGISTRY/$NAMESPACE/$service:$tag -f Dockerfile .
    timeout: 10m

  # ── Step 3: Push to registry ──────────────────────────────────────
  - name: Push
    run: docker push $REGISTRY/$NAMESPACE/$service:$tag
    timeout: 5m

  # ── Step 4: Deploy via SSH ────────────────────────────────────────
  - name: Deploy
    uses: ssh
    host: $target
    run: |
      docker pull $REGISTRY/$NAMESPACE/$service:$tag
      docker stop $service || true
      docker rm $service || true
      docker run -d --name $service \
        --restart always \
        -p 3000:3000 \
        $REGISTRY/$NAMESPACE/$service:$tag
    timeout: 5m

  # ── Step 5: Health check (non-blocking) ───────────────────────────
  - name: Health Check
    uses: ssh
    host: $target
    run: |
      sleep 3
      curl -f http://localhost:3000/health && echo "OK" || echo "HEALTH_CHECK_FAILED"
    continue-on-error: true
    timeout: 30s

  # ── Step 6: Notification ──────────────────────────────────────────
  - name: Notify
    run: |
      echo "Deploy complete: $service -> $tag on $target"
