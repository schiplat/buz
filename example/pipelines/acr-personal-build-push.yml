# Build and push to Alibaba Cloud ACR Personal Edition via registry_secret.
#
# Prerequisites:
#   1) Secrets & Variables → Secrets named `ACR_PERSONAL` (AES-256-GCM at rest).
#      Leave **Team share OFF** (default); allowlist via secrets: + purpose slot.
#      {
#        "provider": "acr_personal",
#        "registry": "registry.cn-hongkong.aliyuncs.com",
#        "username": "<ACR login name>",
#        "password": "<fixed password from ACR console>"
#      }
#      `registry` is required for shell push (no step `image` to infer from).
#   2) Runner with Docker CLI/daemon and labels: [linux-x64].
#
# Flow: prepare context → docker build → docker push (login via registry_secret)
#       → optional verify pull with engine: docker + registry_secret.

name: acr-personal-build-push
description: Orchestrated docker build + push to ACR Personal Edition (registry_secret)
team: default

on:
  manual:
    inputs:
      tag:
        description: Image tag to build and push
        required: true
        default: "1.0"
        type: string

runner:
  labels: [linux-x64]
  timeout: 30m

secrets:
  - ACR_PERSONAL

env:
  REGISTRY: registry.cn-hongkong.aliyuncs.com
  NAMESPACE: dadou
  IMAGE_NAME: hello

steps:
  # ── 1. Build context (self-contained; no pre-mounted repo required) ──
  - name: Prepare context
    run: |
      mkdir -p hello
      cat > hello/Dockerfile <<'EOF'
      FROM alpine:3.20
      CMD ["echo", "hello from ACR build"]
      EOF
      echo "IMAGE=$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      cat hello/Dockerfile
    timeout: 1m

  # ── 2. Build on the runner host (no registry login needed) ──
  - name: Build image
    engine: shell
    run: |
      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      docker build -t "$IMAGE" -f hello/Dockerfile hello
      docker images "$IMAGE"
    timeout: 10m

  # ── 3. Push — Manager resolves registry_secret → Runner docker login/logout ──
  - name: Push image
    engine: shell
    secrets: [ACR_PERSONAL]
    registry_secret: ${secrets.ACR_PERSONAL}
    run: |
      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      echo "Pushing $IMAGE"
      docker push "$IMAGE"
    timeout: 15m

  # ── 4. Verify — pull + run the image just pushed ──
  - name: Verify pull
    engine: shell
    secrets: [ACR_PERSONAL]
    registry_secret: ${secrets.ACR_PERSONAL}
    run: |
      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      docker pull "$IMAGE"
      docker run --rm "$IMAGE"
    timeout: 10m
