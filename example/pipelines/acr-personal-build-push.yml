# Build and push to Alibaba Cloud ACR Personal Edition.
#
# Prerequisites:
#   1) Secrets & Variables → Secrets (plain values, encrypted at rest):
#      REGISTRY_USERNAME / REGISTRY_PASSWORD — leave **Team share OFF** (default);
#      allowlist via secrets:.
#   2) Runner with Docker CLI/daemon and labels: [linux-x64].
#
# Flow: prepare context → docker build → docker login (inline step; job-scoped
#       DOCKER_CONFIG) → docker push → optional verify pull.
# With a step index configured, `uses: buz/docker-login@1.0.0` replaces the
# inline login step.

name: acr-personal-build-push
description: Orchestrated docker build + push to ACR Personal Edition (inline registry login)
team: default

on:
  manual:
    inputs:
      tag:
        description: Image tag to build and push
        required: true
        default: "1.0"
        type: string

runner:
  labels: [linux-x64]
  timeout: 30m

secrets:
  - REGISTRY_USERNAME
  - REGISTRY_PASSWORD

env:
  REGISTRY: registry.cn-hongkong.aliyuncs.com
  NAMESPACE: myns
  IMAGE_NAME: hello

steps:
  # ── 1. Build context (self-contained; no pre-mounted repo required) ──
  - name: Prepare context
    run: |
      mkdir -p hello
      cat > hello/Dockerfile <<'EOF'
      FROM alpine:3.20
      CMD ["echo", "hello from ACR build"]
      EOF
      echo "IMAGE=$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      cat hello/Dockerfile
    timeout: 1m

  # ── 2. Build on the runner host (no registry login needed) ──
  - name: Build image
    engine: shell
    run: |
      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      docker build -t "$IMAGE" -f hello/Dockerfile hello
      docker images "$IMAGE"
    timeout: 10m

  # ── Registry login — job-scoped DOCKER_CONFIG (buz/docker-login covers this too) ──
  - name: Registry login
    engine: shell
    env:
      REGISTRY_USERNAME: ${secrets.REGISTRY_USERNAME}
      REGISTRY_PASSWORD: ${secrets.REGISTRY_PASSWORD}
    run: |
      printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
    timeout: 1m
  # ── 3. Push — credentials from the job-scoped DOCKER_CONFIG above ──
  - name: Push image
    engine: shell
    run: |
      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      echo "Pushing $IMAGE"
      docker push "$IMAGE"
    timeout: 15m

  # ── 4. Verify — pull + run the image just pushed ──
  - name: Verify pull
    engine: shell
    run: |
      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      docker pull "$IMAGE"
      docker run --rm "$IMAGE"
    timeout: 10m

  # ── 5. Logout — hygiene; the Runner also removes the job-scoped dir at job end ──
  - name: Registry logout
    engine: shell
    run: |
      docker logout "$REGISTRY" 2>/dev/null || true
    timeout: 1m
