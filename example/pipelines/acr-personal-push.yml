# Push-only demo. For full build → push → verify, see acr-personal-build-push.yml.
# Create plain secrets (Secrets & Variables → Secrets) REGISTRY_USERNAME /
# REGISTRY_PASSWORD with Team share OFF; allowlist via secrets:.

name: acr-personal-push
description: docker login (buz/docker-login) + push
team: default

on:
  manual: {}

runner:
  labels: [linux-x64]
  timeout: 30m

secrets:
  - REGISTRY_USERNAME
  - REGISTRY_PASSWORD

steps:
  - name: Registry login
    uses: buz/docker-login@1.0.0
    with:
      registry: registry.cn-hongkong.aliyuncs.com
      username: ${secrets.REGISTRY_USERNAME}
      password: ${secrets.REGISTRY_PASSWORD}

  - name: Push image
    engine: shell
    run: |
      # Image must already exist locally (build in a prior step).
      docker tag myapp:local registry.cn-hongkong.aliyuncs.com/myns/hello:1.0
      docker push registry.cn-hongkong.aliyuncs.com/myns/hello:1.0
    timeout: 15m
  - name: Registry logout
    uses: buz/docker-logout@1.0.0
    with:
      registry: registry.cn-hongkong.aliyuncs.com

