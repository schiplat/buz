# Push-only demo. For full build → push → verify, see acr-personal-build-push.yml.
# Create plain secrets (Secrets & Variables → Secrets) REGISTRY_USERNAME /
# REGISTRY_PASSWORD with Team share OFF; allowlist via secrets:.

name: acr-personal-push
description: docker login + push (shell engine, inline registry login)
team: default

on:
  manual: {}

runner:
  labels: [linux-x64]
  timeout: 30m

secrets:
  - REGISTRY_USERNAME
  - REGISTRY_PASSWORD

steps:
  - name: Push image
    engine: shell
    env:
      REGISTRY_USERNAME: ${secrets.REGISTRY_USERNAME}
      REGISTRY_PASSWORD: ${secrets.REGISTRY_PASSWORD}
    run: |
      printf '%s\n' "$REGISTRY_PASSWORD" | docker login registry.cn-hongkong.aliyuncs.com --username "$REGISTRY_USERNAME" --password-stdin
      # Image must already exist locally (build in a prior step).
      docker tag myapp:local registry.cn-hongkong.aliyuncs.com/myns/hello:1.0
      docker push registry.cn-hongkong.aliyuncs.com/myns/hello:1.0
      docker logout registry.cn-hongkong.aliyuncs.com 2>/dev/null || true   # hygiene; job dir cleaned by Runner anyway
    timeout: 15m
