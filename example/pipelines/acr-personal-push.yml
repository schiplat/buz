# Push-only demo. For full build → push → verify, see acr-personal-build-push.yml.
# Secret JSON must include `registry` (no step image to infer from).

name: acr-personal-push
description: docker login + push via registry_secret (shell engine)
team: default

on:
  manual: {}

runner:
  labels: [docker]
  timeout: 30m

steps:
  - name: Push image
    uses: shell
    registry_secret: acr-personal
    run: |
      # Image must already exist locally (build in a prior step).
      docker tag myapp:local crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com/namespace/app:1.0
      docker push crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com/namespace/app:1.0
    timeout: 15m
