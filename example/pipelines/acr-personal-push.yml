# Push-only demo. For full build → push → verify, see acr-personal-build-push.yml.
# Secret JSON must include `registry` (no step image to infer from).
# Create secret (Secrets & Variables → Secrets) with Team share OFF;
# allowlist via secrets: and bind the purpose slot with ${secrets.NAME}.

name: acr-personal-push
description: docker login + push via registry_secret (shell engine)
team: default

on:
  manual: {}

runner:
  labels: [linux-x64]
  timeout: 30m

secrets:
  - ACR_PERSONAL

steps:
  - name: Push image
    engine: shell
    secrets: [ACR_PERSONAL]
    registry_secret: ${secrets.ACR_PERSONAL}
    run: |
      # Image must already exist locally (build in a prior step).
      docker tag myapp:local registry.cn-hongkong.aliyuncs.com/myns/hello:1.0
      docker push registry.cn-hongkong.aliyuncs.com/myns/hello:1.0
    timeout: 15m
