# Private registry login (ACR Personal Edition) for docker pull / push.
#
# 1) Create Secrets & Variables → Secrets (plain values, encrypted at rest):
#    REGISTRY_USERNAME / REGISTRY_PASSWORD. Leave **Team share OFF** (default)
#    so unrelated pipelines never get them as env.
#
# 2) Allowlist via secrets:. A shell login step first (job-scoped DOCKER_CONFIG),
#    then engine: docker pulls read the same config.
#
# Personal Edition uses a fixed password (not temporary GetAuthorizationToken).

name: acr-personal-pull
description: Pull a private ACR Personal Edition image (inline registry login)
team: default

on:
  manual: {}

runner:
  labels: [linux-x64]
  timeout: 15m

secrets:
  - REGISTRY_USERNAME
  - REGISTRY_PASSWORD

steps:
  # ── Registry login — job-scoped DOCKER_CONFIG; the docker-engine pull below reads it ──
  - name: Registry login
    engine: shell
    env:
      REGISTRY_USERNAME: ${secrets.REGISTRY_USERNAME}
      REGISTRY_PASSWORD: ${secrets.REGISTRY_PASSWORD}
    run: |
      printf '%s\n' "$REGISTRY_PASSWORD" | docker login registry.cn-hongkong.aliyuncs.com --username "$REGISTRY_USERNAME" --password-stdin
    timeout: 1m

  - name: Run private image
    engine: docker
    image: registry.cn-hongkong.aliyuncs.com/myns/demo-app
    run: |
      echo "hello from private ACR image"
      uname -a || true
    timeout: 10m
