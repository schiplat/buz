# ── Buz Pipeline Validation Test ──────────────────────────────────
# Exercises: local exec, SSH (single + multi-host), dynamic inputs,
#            continue-on-error, retry, timeout.
#
# No secrets:/registry_secret — with team_shared default false, same-team
# secrets are not auto-injected into this smoke job.
#
# Place this file under the Manager's yaml_scan_dir (default: ./pipelines/).
# Team: defaults to "default" if omitted; set `team: <slug>` to assign another team.
#
# Trigger inputs: use $INPUT_<KEY> in run blocks. The host: field expands
# trigger input names as $key (not $INPUT_KEY) — e.g. host: $target_env.

name: Integration Smoke Test
description: Validates all Phase 1 pipeline features across local and SSH engines.

team: default

on:
  manual:
    inputs:
      target_env:
        description: Deployment environment
        required: true
        default: staging
        type: string
      version:
        description: App version tag
        required: false
        default: latest
        type: string

runner:
  labels: [linux-x64]
  timeout: 10m

env:
  APP_NAME: buz-smoke

steps:
  # ── Step 1: Local — system info (always passes) ──────────────────
  - name: System Check
    run: |
      echo "Runner: $(hostname)"
      echo "Arch:   $(uname -m)"
      echo "Env:    $INPUT_TARGET_ENV"
      echo "Ver:    $INPUT_VERSION"

  # ── Step 2: Local — disk space (non-fatal) ───────────────────────
  - name: Disk Health
    run: df -h / || true
    continue-on-error: true

  # ── Step 3: SSH single host — uptime check ───────────────────────
  #           Requires a Host named "dev-vm" configured in Manager UI.
  - name: Remote Uptime
    engine: ssh
    host: dev-vm
    run: |
      echo "Connected to $(hostname)"
      uptime
      free -h
    timeout: 30s

  # ── Step 4: SSH multi-host — fleet health ────────────────────────
  #           Runs the same command on every host in the array.
  - name: Fleet Status
    engine: ssh
    host:
      - dev-vm
      - dev-vm
    run: |
      echo "=== $(hostname) ==="
      systemctl is-active nginx || echo "nginx not running"
      docker ps --format 'table {{.Names}}\t{{.Status}}'

  # ── Step 5: Local — final confirmation ───────────────────────────
  - name: Done
    run: echo "Smoke test completed for $INPUT_TARGET_ENV @ $INPUT_VERSION"
