# Demo: trigger input masking
#
# How to verify:
# 1) Pipelines → New Pipeline → YAML tab → paste this → Import to Form
#    Expect: Params has version + deploy_token; deploy_token has Masking checked
# 2) Save (pick your team), then Trigger
#    Expect: deploy_token is a password field with "masking" badge
# 3) Enter version=1.0.0 and deploy_token=tok-demo-secret-xyz → Run
# 4) Job Detail → Trigger Inputs: deploy_token shows ***
# 5) Job logs ==> RUN env: deploy_token=*** (log masking — expected)
# 6) Step "Prove token is usable" succeeds → process read $INPUT_DEPLOY_TOKEN OK
# 7) On the Runner host: cat /tmp/res.txt  → must equal the token you typed
#
# Inputs are a map; each key is available as $INPUT_<KEY> in run blocks.
#
# Optional DB check (Manager host):
#   sqlite3 data/buz.db "SELECT trigger_params FROM jobs ORDER BY created_at DESC LIMIT 1;"
#   deploy_token should look like "buzenc:v1:…" not plaintext.

name: masking-input-demo
description: Demo for masking:true trigger inputs (logs + audit + DB encrypt)
team: default

on:
  manual:
    inputs:
      version:
        description: Release version (visible in logs)
        required: true
        default: "1.0.0"
        type: string
      deploy_token:
        description: One-time deploy token (masked)
        required: true
        masking: true
        type: string
      target:
        description: Deploy target label
        required: false
        default: staging
        type: string

runner:
  labels: [linux-x64]
  timeout: 5m

steps:
  - name: Show non-secret inputs
    run: |
      echo "version=$INPUT_VERSION"
      echo "target=$INPUT_TARGET"

  - name: Prove token is usable
    run: |
      # Simulates app reading the env: must be non-empty plaintext (not log placeholder)
      test -n "$INPUT_DEPLOY_TOKEN"
      test "$INPUT_DEPLOY_TOKEN" != "***"
      # Write plaintext to runner host for local verify (not uploaded as job logs)
      echo "$INPUT_DEPLOY_TOKEN" > /tmp/res.txt
      echo "INPUT_DEPLOY_TOKEN usable (len=${#INPUT_DEPLOY_TOKEN}); wrote /tmp/res.txt on runner"
