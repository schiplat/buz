# ── OSS Config Delivery Demo ──────────────────────────────────────────
# Verifies the config_source / config_path chain end-to-end:
#
#   1. YAML parser accepts `config_source` + `config_path` on a step.
#   2. Manager syncs both fields into tasks (visible in Edit Pipeline).
#   3. At job dispatch the Manager resolves the referenced secret
#      (kind = Aliyun OSS auth), signs a 1-hour GET URL for
#      `config_path + /configs.tar.gz`, and injects it as $BUZ_CONFIG_URL
#      (redacted in logs).
#   4. The Runner **downloads and unpacks the bundle itself** before the run
#      block (config_source internal unpack), exposing the directory as
#      $BUZ_CONFIG_DIR. The run block never needs to curl — it just reads
#      the unpacked files. No AK/SK ever reaches the target.
#
# ── IMPORTANT: this demo requires a REAL OSS object ──────────────────────
# Because the Runner downloads the bundle during the prepare stage, a failed
# download (HTTP 404 / 403) FAILS THE JOB immediately — the run block never
# executes. Fake AK/SK will NOT pass: the signed URL must resolve to an object
# that actually exists in the bucket.
#
# To run this end-to-end you must:
#   1. Upload a tar.gz to your OSS bucket at:
#        config_tpl/demo/<tag>/configs.tar.gz     (e.g. .../v1.3.2/configs.tar.gz)
#   2. Create the secret with REAL credentials (read-only RAM user):
#        Buz UI → Secrets & Variables → Secrets → Add Secret
#          Name  : OSS_DEMO
#          Team  : default
#          Kind  : Aliyun OSS auth
#          Value : {"provider":"aliyun_oss","endpoint":"oss-cn-hongkong.aliyuncs.com",
#                   "bucket":"<your-bucket>","region":"cn-hongkong",
#                   "access_key_id":"LTAI...","access_key_secret":"..."}
#        (secret names are UPPER_SNAKE_CASE — auto-uppercased in the UI form)
#
# Failure modes (all fast-fail before the run block):
#   - secret missing / wrong team      → `config_source 'OSS_DEMO' not found ...`
#   - secret kind is not OSS auth      → `set Kind to Aliyun OSS auth`
#   - secret JSON incomplete            → `requires JSON with endpoint/bucket/...`
#   - object missing in bucket          → `config bundle download returned HTTP 404`
#   - credentials invalid / no permission → `config bundle download returned HTTP 403`

name: OSS Config Delivery Demo
description: "Verifies config_source → signed OSS URL → runner-side unpack into $BUZ_CONFIG_DIR."

team: default

on:
  manual:
    inputs:
      tag:
        description: Config bundle tag (e.g. v0.0.1)
        required: false
        default: "v1.3.2"

runner:
  labels: [macos]
  timeout: 5m

steps:
  # ── 1. Fetch config bundle from OSS (shell engine, local runner) ──
  # The Runner downloads + unpacks config_tpl/demo/$tag/configs.tar.gz during
  # the prepare stage (before the run block). $BUZ_CONFIG_DIR points at the
  # unpacked bundle; env_render output is written there too.
  - name: Fetch config bundle
    uses: shell
    config_source: OSS_DEMO
    config_path: config_tpl/demo/$tag
    run: |
      echo "==> BUZ_CONFIG_DIR: ${BUZ_CONFIG_DIR:-<unset>}"
      if [ ! -d "${BUZ_CONFIG_DIR:-}" ]; then
        echo "!! BUZ_CONFIG_DIR is empty — config_source was not resolved" >&2
        exit 1
      fi
      echo "==> bundle contents:"
      ls -la "$BUZ_CONFIG_DIR"
      echo "==> config_source verified: signed URL dispatched + bundle unpacked"

  # ── 2. Echo sanity (no config) ──
  - name: Echo sanity
    uses: shell
    run: |
      echo "==> config_source absent on this step: ${BUZ_CONFIG_URL:-unset}"
      echo "==> BUZ_CONFIG_DIR absent on this step: ${BUZ_CONFIG_DIR:-unset}"
