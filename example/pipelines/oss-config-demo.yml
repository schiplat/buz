# ── OSS Config Block Demo (deliver + render-only) ─────────────────────
# Verifies the config flow end-to-end on a shell/local runner:
#
#   1. Deliver: fetch a presigned OSS URL into dest (plain curl + tar).
#   2. Render: nested `config: { dest, render }` — render-only.
#      config_render on tasks (no flat config_path / env_render).
#   3. Deliver step: Manager signs a 1-hour GET for
#      `key_path + /configs.tar.gz` → Runner unpacks to dest ($BUZ_CONFIG_DIR).
#   4. Render-only step: templates already at dest → write outputs
#      (no second OSS download). Prefer a separate Compose/app step after
#      this in real deploy pipelines — do not use on_change here.
#
# Bundle layout expected under the OSS object (example):
#   env.example          → rendered to .env
#   (optional) more *.tpl files → add more `render:` entries
#
# ── IMPORTANT: requires a REAL OSS object ───────────────────────────────
# A failed download (HTTP 404 / 403) FAILS THE JOB before the run block.
# Fake AK/SK will NOT pass.
#
# To run end-to-end:
#   1. Upload configs.tar.gz to:
#        config_tpl/demo/<tag>/configs.tar.gz
#      Include at least `env.example` if you want the Render step to succeed.
#   2. Create secret (Kind = Aliyun OSS auth), name OSS_DEMO, same team:
#        {"provider":"aliyun_oss","endpoint":"oss-cn-hongkong.aliyuncs.com",
#         "bucket":"<bucket>","region":"cn-hongkong",
#         "access_key_id":"LTAI...","access_key_secret":"..."}
#
# Failure modes (prepare-stage, before run):
#   - secret missing / wrong team      → config_source 'OSS_DEMO' not found
#   - wrong kind                       → set Kind to Aliyun OSS auth
#   - object missing                   → config bundle download HTTP 404
#   - render template missing at dest  → config_render: template '…' not found

name: OSS Config Delivery Demo
description: "Config flow: presigned OSS URL → fetch → render-only into $BUZ_CONFIG_DIR."

team: default

on:
  manual:
    inputs:
      tag:
        description: Config bundle tag (e.g. v0.0.1)
        required: false
        default: "v1.3.2"
        type: string

runner:
  labels: [macos]
  timeout: 5m

secrets:
  - CONFIG_BUNDLE_URL

steps:
  # ── 1. Fetch config bundle (presigned OSS URL → unpack) ────────────
  - name: Fetch config bundle
    uses: buz/config-fetch@1.1.0
    with:
      url: ${secrets.CONFIG_BUNDLE_URL}   # presigned, TTL <= 1h — refresh per deploy
      dest: config                        # workspace-relative
      echo "==> BUZ_CONFIG_DIR: ${BUZ_CONFIG_DIR:-<unset>}"
      if [ ! -d "${BUZ_CONFIG_DIR:-}" ]; then
        echo "!! BUZ_CONFIG_DIR is empty — OSS deliver did not run" >&2
        exit 1
      fi
      echo "==> bundle contents:"
      ls -la "$BUZ_CONFIG_DIR"
      echo "==> deliver OK"

  # ── 2. Render-only (no OSS; templates already under dest) ──────────
  # List form shows multi-file shape; add more entries as the bundle grows.
  # $BUZ_ENV_CHANGED(_KEYS) are set on THIS step only — a later Compose step
  # should own `docker compose up` (preferred over render on_change).
  - name: Render env
    engine: shell
    config:
      dest: config
      render:
        - template: env.example
          output: .env
          mode: "0600"
          on_missing: fail
    run: |
      echo "==> BUZ_CONFIG_DIR: ${BUZ_CONFIG_DIR:-<unset>}"
      ls -l "$BUZ_CONFIG_DIR/.env"
      echo "==> env changed: ${BUZ_ENV_CHANGED:-0} (${BUZ_ENV_CHANGED_KEYS:-none})"
      echo "==> render-only OK"

  # ── 3. Sanity (no config prepare) ──────────────────────────────────
  - name: Echo sanity
    engine: shell
    run: |
      echo "==> BUZ_CONFIG_DIR absent on this step: ${BUZ_CONFIG_DIR:-unset}"
