# ── Deploy super-pro manager-server to the target server ──
#
# Build & push happen in GitHub Actions (hzbd/super-pro's `release-manager.yml`
# builds linux/amd64 and pushes to ACR Hong Kong). This Buz pipeline only
# SSHes to the target device, pulls the image, and runs it.
#
#   GitHub Actions (super-pro repo)        Buz pipeline (this file)
#   ─────────────────────────────          ─────────────────────────────
#   checkout super-pro + super             SSH → target host
#   build linux/amd64 image                docker pull super-manager:<tag>
#   push to ACR HK                         docker compose up -d manager-server
#                                          health check
#
# PostgreSQL & Redis are ALREADY deployed on the target server (host port
# mapping). The compose runs ONLY manager-server and connects to them via
# `host.docker.internal` (extra_hosts: host-gateway). DATABASE_URL /
# MANAGER_REDIS_URL come from /opt/manager/.env on the server.
#
# Prerequisites:
#   1) The image already exists in ACR HK:
#        registry.cn-hongkong.aliyuncs.com/dadou/super-manager:<tag>
#      (produced by hzbd/super-pro .github/workflows/release-manager.yml)
#   2) Infrastructure → Secrets → New Secret `ACR_PERSONAL` (AES-256-GCM at rest):
#        {
#          "provider": "acr_personal",
#          "registry": "registry.cn-hongkong.aliyuncs.com",
#          "username": "<ACR login name>",
#          "password": "<fixed password from ACR console>"
#        }
#      registry_secret lets the runner docker-login the TARGET server to ACR.
#   3) Infrastructure → Hosts → register the target device (SSH key/vault/agent);
#      set input `deploy_host` to that Host name.
#   4) First deploy only (one-time): create /opt/manager/.env on the server:
#        DATABASE_URL=postgres://<user>:<pass>@host.docker.internal:5432/super_manager
#        MANAGER_REDIS_URL=redis://host.docker.internal:6379/0
#      The pipeline only rewrites MANAGER_IMAGE; it never touches your secrets.
#   5) Runner (e.g. on your local VM) with labels: [linux-x64].

name: super-manager deploy
description: Pull the manager-server image from ACR HK and run it on the target host.
team: default

on:
  manual:
    inputs:
      tag:
        description: Image tag to deploy (must already exist in ACR, e.g. 1.2.5)
        required: true
        default: "1.2.5"
      deploy_host:
        description: Buz Host name of the target device
        required: true
        default: "gz-server"

runner:
  labels: [linux-x64]
  timeout: 20m

env:
  REGISTRY: registry.cn-hongkong.aliyuncs.com
  NAMESPACE: dadou
  IMAGE_NAME: super-manager
  DEPLOY_DIR: /opt/manager

steps:
  # ── 1. Deploy manager-server (SSH + docker compose) ────────────────
  # registry_secret: runner logs the target server's docker into ACR first,
  # then pulls and starts only manager-server. PG/Redis stay untouched.
  - name: Deploy manager-server
    uses: ssh
    host: $deploy_host
    registry_secret: ACR_PERSONAL
    run: |
      # Fail-fast is built in (SSH prepends `set -e;`); no manual `set -e`.
      # Validate the trigger input: image tags must be plain, no shell metacharacters.
      case "$INPUT_TAG" in
        ''|*[!A-Za-z0-9._-]*)
          echo "ERROR: invalid tag '$INPUT_TAG' (allowed: A-Za-z0-9 . _ -)" >&2
          exit 1
          ;;
      esac
      mkdir -p "$DEPLOY_DIR"
      cd "$DEPLOY_DIR"

      if [ ! -f docker-compose.yml ]; then
        echo "==> First deploy: writing docker-compose.yml"
        cat > docker-compose.yml <<'COMPOSE'
      services:
        manager-server:
          image: ${MANAGER_IMAGE:-registry.cn-hongkong.aliyuncs.com/dadou/super-manager:latest}
          container_name: manager-server
          restart: unless-stopped
          env_file: [.env]
          environment:
            MANAGER_BIND: "0.0.0.0:8787"
            MANAGER_ISSUED_DIR: /app/keys/issued
          # Reach the already-running PG/Redis on the server host.
          extra_hosts:
            - "host.docker.internal:host-gateway"
          ports:
            - "127.0.0.1:8787:8787"
          volumes:
            - manager_issued:/app/keys/issued
          healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s

      volumes:
        manager_issued:
      COMPOSE
      else
        echo "==> Upgrade: docker-compose.yml exists, keep it"
      fi

      if [ ! -f .env ]; then
        echo "ERROR: $DEPLOY_DIR/.env missing — create it first (see super-pro/manager/docker/env.example)." >&2
        echo "Set at least DATABASE_URL and MANAGER_REDIS_URL pointing at the running PG/Redis." >&2
        exit 1
      fi

      IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_TAG"
      echo "==> Pin MANAGER_IMAGE=$IMAGE"
      if grep -q '^MANAGER_IMAGE=' .env; then
        sed -i "s|^MANAGER_IMAGE=.*|MANAGER_IMAGE=$IMAGE|" .env
      else
        echo "MANAGER_IMAGE=$IMAGE" >> .env
      fi

      echo "==> Pull + up manager-server"
      docker compose pull manager-server
      docker compose up -d manager-server
      docker compose ps
    timeout: 10m

  # ── 2. Health check (non-blocking) ─────────────────────────────────
  - name: Health check
    uses: ssh
    host: $deploy_host
    run: |
      sleep 10
      curl -fsS http://127.0.0.1:8787/health && echo && echo "manager-server healthy"
    continue-on-error: true
    timeout: 1m
