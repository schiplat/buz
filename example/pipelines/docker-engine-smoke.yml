# ── Docker Engine Smoke ─────────────────────────────────────────
# Runs a step inside an ephemeral container on the runner (uses: docker).
# Requires runner: engine.docker_enabled = true and Docker CLI/daemon.
# Prefer runner.labels including "docker" so only capable nodes claim the job.

name: Docker Engine Smoke
description: Verify uses:docker executes run: inside alpine on the runner.

team: default

on:
  manual: {}

runner:
  labels: [linux-x64, docker]
  timeout: 5m

steps:
  - name: Hello from container
    uses: docker
    image: alpine:3.20
    run: |
      echo hello
      uname -a
      cat /etc/os-release | head -3
      echo "workspace ok" > /buz/workspace/smoke.txt
      cat /buz/workspace/smoke.txt
    timeout: 2m
