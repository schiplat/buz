# ── Docker Engine Smoke ─────────────────────────────────────────
# Runs a step inside an ephemeral container on the runner (engine: docker).
# Requires runner: engine.docker_enabled = true and Docker CLI/daemon.
# Prefer runner.labels: [linux-x64]. Runner still needs engine.docker_enabled.

name: Docker Engine Smoke
description: "Verify engine: docker executes run: inside alpine on the runner."

team: default

on:
  manual:
    inputs:
      version:
        description: Version to deploy
        required: true
        type: string

runner:
  labels: [linux-x64]
  timeout: 5m

env:
  SMOKE_ENV: from-pipeline

# Explicit pipeline secrets bind (Team share not required).
# Create DOCKER_REGISTRY_PASS under Secrets & Variables → Secrets (same team),
# or enable Team share for auto-inject. Secret names are UPPER_SNAKE_CASE.
secrets:
  - DOCKER_REGISTRY_PASS

steps:
  - name: Hello from container
    engine: docker
    image: alpine:3.20
    volumes:
      - "/tmp/runner/docker-demo:/var/log/app"
    work_dir: /demo/app/
    run: |
      echo hello
      uname -a
      cat /etc/os-release | head -3
      echo "workspace ok" > /buz/workspace/smoke.txt
      cat /buz/workspace/smoke.txt
      pwd
      cd /
      pwd
      ls -la
      echo "workspace ok" > /var/log/app/smoke.txt
      sleep 3
      echo "waiting .... $INPUT_VERSION" > /var/log/app/res.txt
      sleep 5
      echo "SMOKE_ENV=$SMOKE_ENV" >> /var/log/app/res.txt
      sleep 5
      echo "DOCKER_REGISTRY_PASS=$DOCKER_REGISTRY_PASS" >> /var/log/app/res.txt
      sleep 30
    timeout: 2m

