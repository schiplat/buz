# ── DinD CI Pipeline ───────────────────────────────────────────
# Docker-in-Docker: build, tag, and push a container image inside
# an isolated docker:dind container with --privileged.
#
# Each step runs inside a fresh docker:dind container with its own
# Docker daemon — no host daemon sharing, no docker.sock mount.
#
# Security: privileged containers can escape to the host via nsenter
# or kernel exploits. Only use this pipeline on disposable runner VMs.
#
# Requires: runner with `engine.docker_enabled = true` and labels: [linux-x64].
# Secrets (UPPER_SNAKE_CASE): create under Secrets & Variables → Secrets.

name: CI Build and Push
environments: [default]
description: Build a Docker image with DinD, push to registry, then deploy via SSH.

team: default

on:
  manual:
    inputs:
      version:
        description: Version tag for the image
        required: true
        type: string
      target:
        description: Target host name for deployment (must exist in Hosts)
        required: false
        default: staging
        type: string

runner:
  labels: [linux-x64]
  timeout: 30m

env:
  REGISTRY: registry.example.com
  NAMESPACE: apps
  IMAGE_NAME: my-service

# Explicit bind — Team share not required. Secrets must exist in the same team.
secrets:
  - DOCKER_REGISTRY_USER
  - DOCKER_REGISTRY_PASS

  # │   DESIGN NOTE: DinD login sharing                          │
  # │   Each engine: docker step is a fresh ephemeral container     │
  # │   (docker run --rm). The inner dockerd and login state are  │
  # │   destroyed when the step ends. Therefore build, login, and │
  # │   push must happen in a SINGLE step — they cannot be split. │
  # │   buz/docker-login cannot be used here: it writes the     │
  # │   host-level config, which the inner daemon never reads.    │

steps:
  # ── Step 1: Login + Build + Push ──────────────────────────────
  # Single step: starts inner daemon, logs in, builds, pushes.
  # All three must share one container because DinD daemon state
  # cannot persist across steps.
  - name: Build and Push
    engine: docker
    image: docker:27-dind
    privileged: true
    run: |
      echo "Starting inner Docker daemon..."
      dockerd &
      sleep 3
      echo "Logging in to registry..."
      printf '%s\n' "$DOCKER_REGISTRY_PASS" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin "$REGISTRY"
      echo "Building $REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_VERSION"
      docker build -t "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_VERSION" .
      echo "Pushing to registry..."
      docker push "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_VERSION"
      docker logout "$REGISTRY"
      echo "Done."
    timeout: 20m

  # ── Step 2: Deploy via SSH to target host ───────────────────────
  # host: expands trigger input `$target` (not $INPUT_TARGET).
  - name: Deploy
    engine: ssh
    host: $target
    run: |
      docker pull "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_VERSION"
      docker stop my-service || true
      docker rm my-service || true
      docker run -d --name my-service \
        --restart always \
        -p 3000:3000 \
        "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$INPUT_VERSION"
    timeout: 5m

  # ── Step 3: Health check ────────────────────────────────────────
  - name: Health Check
    engine: ssh
    host: $target
    run: |
      sleep 3
      curl -f http://localhost:3000/health && echo "OK" || echo "HEALTH_CHECK_FAILED"
    continue-on-error: true
    timeout: 30s
