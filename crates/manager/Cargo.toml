[package]
name = "manager"
version.workspace = true
edition.workspace = true

[[bin]]
name = "buz-manager"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared", features = ["web"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"

# Database (bundled SQLite — no system libsqlite3 required in Docker)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
uuid.workspace = true
chrono.workspace = true

# Config
config.workspace = true
clap.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"

# Crypto (AES-256-GCM for credential_data encryption at rest)
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
bytes = "1"
# libsodium-compatible sealed box (GitHub Actions secrets encryption)
crypto_box = { version = "0.9", features = ["seal"] }

# Error handling
thiserror.workspace = true
anyhow = "1"

# HTTP client (notify webhooks)
reqwest = { version = "0.12", features = ["json"] }
url = "2"

# Cron expression parser
cron = "0.15"

# SSH connectivity probe (Hosts → Test)
russh = "0.61"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
