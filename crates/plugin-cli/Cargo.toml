[package]
name = "plugin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "buz-plugin — plugin authoring & publishing toolchain (init / validate / index / mirror check)"

[[bin]]
name = "buz-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono.workspace = true
clap.workspace = true
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shared = { path = "../shared" }

[dev-dependencies]
tempfile = "3"
