[package]
name = "runner"
version.workspace = true
edition.workspace = true

[[bin]]
name = "buz-runner"
path = "src/main.rs"

[features]
default = []
docker = []
wasm = []

[dependencies]
shared = { path = "../shared" }

# Async runtime
tokio.workspace = true

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

# Config
config.workspace = true
clap.workspace = true
clap_complete.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# flock atomic writes for env_render
libc = "0.2"

# SSH execution (key handling comes from russh's built-in `keys` module)
russh = "0.65"
async-trait = "0.1"

# Error handling
thiserror.workspace = true
anyhow = "1"

# Parallel SSH fan-out (same-task join; sessions need not be Send across threads)
futures-util = "0.3"

# System information collection
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3"
