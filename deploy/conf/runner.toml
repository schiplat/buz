# Runner config — Docker + binary package
#
# [runner] holds connection + identity. Strategy (labels, concurrency, engines)
# is managed in Manager UI → Runners.
#
# 1) UI → Runners → New Runner → copy register_token
# 2) Set manager_url (same compose network: http://manager:8080)
# 3) name must match the UI Runner name

[runner]
name = "docker-runner-01"
manager_url = "http://manager:8080"
register_token = "REPLACE_WITH_UI_REGISTER_TOKEN"
# tls_skip_verify = false
workspace_dir = "./workspace"
# Strict allows only the Runner-owned workspace and an explicitly requested,
# locally authorized Docker socket. Set true only for trusted Docker-in-Docker jobs.
docker_mount_policy = "strict"
docker_socket_allowed = false
docker_socket_path = "/var/run/docker.sock"
token_cache_path = "./state/runner-token"
# prefer_interfaces = ["eth0"]

[engine]
# ssh_known_hosts_path = "/home/runner/.ssh/known_hosts"
# Scope the Docker CLI config (docker login credentials) to the job workspace.
# per_job (default): {workspace}/{job}/.docker, removed when the job ends.
# shared: legacy host-global ~/.docker/config.json (credential-store setups).
# docker_config_isolation = "per_job"

[clock]
# The Runner must stay consistent with the Manager clock: it is validated on
# startup against the Manager's Date header (and re-checked on every heartbeat).
# A gross skew refuses to start — fix the host clock (NTP) rather than relaxing
# these thresholds. Labs only: fail_on_skew = false.
enabled = true
warn_threshold_seconds = 60
max_skew_seconds = 300
# fail_on_skew = true

# Job-wide Container/VM modes are selected in Manager UI → Runners.
# Host is the default and needs no supervisor. For Container/VM modes, start
# the optional sandboxd Compose profile and configure matching image/runtime
# artifacts in deploy/conf/sandboxd.toml. These backends reject SSH, per-step
# Docker engine, and host-side config preparation rather than falling back.
[sandbox]
supervisor_socket = "/run/buz-sandboxd/sandboxd.sock"
workspace_root = "/app/buz/workspace"
# container_image = "docker.io/library/debian@sha256:<digest>"
# firecracker_guest_image = "docker.io/library/debian@sha256:<digest>"
# firecracker_runtime = "<Firecracker-compatible Docker runtime name>"

[logging]
level = "info"
file = "./logs/runner.log"
