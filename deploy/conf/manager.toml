# Manager config — Docker + binary package

# ── Marketplace link ────────────────────────────────────────────────────────
# Public plugin-marketplace URL linked from the Dashboard's YAML editor.
# Override for internal-mirror or air-gapped deployments (env: BUZ_MARKETPLACE_URL).
# marketplace_url = "https://plugins.example.com"

[server]
host = "0.0.0.0"
port = 8080
# tls_cert = "certs/cert.pem"
# tls_key  = "certs/key.pem"
# Public UI origin for notify deep links (View Job → /jobs/{id}).
# Example: "https://buz.example.com"
# public_base_url = ""

[database]
path = "./data/buz.db"
max_connections = 8

[auth]
# Required: set via BUZ_JWT_SECRET or a strong value here (e.g. openssl rand -hex 32).
# Empty / known template secrets are refused at Manager startup.
jwt_secret = ""
jwt_ttl_hours = 24
runner_register_token_ttl_hours = 24

[runner]
heartbeat_timeout_seconds = 90

# Dev-only (same-container / loopback Runner). Leave disabled in production.
# [standalone]
# enabled = true
# auto_approve = ["standalone-runner"]

[pipeline]
yaml_scan_dir = "./pipelines"
yaml_scan_interval_seconds = 30

["*.aliyuncs.com"]

[logging]
level = "info"
# file = "./logs/manager.log"

# [plugin_index] — optional. All keys default sensibly (local_dir →
# <data_dir>/plugins, reviewed_manifest → <data_dir>/plugins/reviews.json,
# require_reviewed → false) and are editable in the dashboard (Settings).
# Air-gapped or local-mirror deployments can pin local_dir here or via
# BUZ_PLUGIN_INDEX__LOCAL_DIR. See docs → Configuration.

