# Buz Manager reverse proxy — system Nginx (HTTP only), Docker deployment.
#
# For a Manager started by `deploy/dev-deploy.sh` (docker compose):
#
#  1) Tighten the published port so only Nginx is reachable from outside.
#     In /opt/buz/docker-compose.yml change
#         - "${MANAGER_PORT}:8080"
#     to
#         - "127.0.0.1:${MANAGER_PORT}:8080"
#     then `./dev-deploy.sh down && ./dev-deploy.sh up` (JWT secret + volumes are kept).
#     (Not required — if you leave it, 8080 is exposed on all interfaces.)
#
#  2) Install the site config as a non-root user with sudo:
#     sudo cp deploy/nginx/buz-manager-docker.conf /etc/nginx/sites-available/buz-manager.conf
#     sudo ln -s ../sites-available/buz-manager.conf /etc/nginx/sites-enabled/buz-manager.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
#  3) Replace the server_name below with your hostname (or leave `_` as a
#     catch-all for a VM reached by IP only).
#
#  Add HTTPS later by copying this file to sites-available and adding
#  `listen 443 ssl` + ssl_certificate lines (see docs/03-operations/tls.md).

# WebSocket settings — the Upgrade/Connection headers and the long read
# timeout must survive the proxy for live streams to work:
#   - GET /api/v1/jobs/{id}/logs/stream   live job log stream (WebSocket)
#   - GET /api/v1/pipelines/{id}/stream   pipeline stream (WebSocket)
# Only send the upgrade headers when the client actually asks to upgrade;
# plain HTTP requests to these routes proxy normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;               # <-- replace with your public hostname
    # server_name buz.example.com;

    # Pipeline YAML import / log uploads can exceed a few MB.
    client_max_body_size 20m;

    # Compress embedded UI assets and API JSON.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---- WebSocket endpoints (live streams) ----
    location ~ ^/api/v1/(jobs/[^/]+/logs/stream|pipelines/[^/]+/stream)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WS frames can idle while a job runs; keep the tunnel open.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ---- Everything else (API + embedded SPA) ----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Runner long-poll is up to 50s; WS idle keepalive must survive.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
