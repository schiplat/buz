# Buz Manager reverse proxy — system Nginx, HTTPS (Let's Encrypt).
#
#  Prereqs:
#   1) Manager bound to loopback (docs/03-operations/deployment.md → Reverse Proxy):
#      [server]
#      host = "127.0.0.1"
#      port = 8080
#   2) Certificates already issued, e.g. certbot:
#      sudo certbot certonly --nginx -d buz.example.com
#
#  Install:
#   sudo cp deploy/nginx/buz-manager-ssl.conf /etc/nginx/sites-available/buz-manager-ssl.conf
#   sudo ln -s ../sites-available/buz-manager-ssl.conf /etc/nginx/sites-enabled/buz-manager-ssl.conf
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name buz.example.com;   # <-- replace with your public hostname
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name buz.example.com;   # <-- replace with your public hostname

    ssl_certificate     /etc/letsencrypt/live/buz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buz.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Pipeline YAML import / log uploads can exceed a few MB.
    client_max_body_size 20m;

    # Compress embedded UI assets and API JSON.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Everything (API + embedded SPA) is served by buz-manager on loopback.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket: live job logs (/api/v1/jobs/{id}/logs/stream) and
        # pipeline stream (/api/v1/pipelines/{id}/stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Runner long-poll is up to 50s; WS idle keepalive must survive.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
