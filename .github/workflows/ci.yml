name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings; skip debuginfo in CI — faster links + less disk than default test/dev profiles.
  RUSTFLAGS: "-D warnings -C debuginfo=0"
  CARGO_INCREMENTAL: "0"

jobs:
  # Lightweight + parallel with backend/dashboard: fail-fast on style without waiting
  # for disk cleanup or a full compile.
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Backend ────────────────────────────────────────
  backend:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lean cleanup (~30–60s) vs free-disk-space action (often several minutes).
      # Biggest reclaim: Android SDK + .NET + GHC + tool-cache + Docker images.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

      - uses: dtolnay/rust-toolchain@stable

      # Bounded cache (prunes workspace crates / incremental before save).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-backend-stable

      # `cargo test --all` typechecks + builds; no separate `cargo check`.
      - name: Run tests
        run: cargo test --all

  # ── Dashboard ───────────────────────────────────────
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
