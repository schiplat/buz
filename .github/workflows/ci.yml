name: CI

on:
  push:
    branches: [main, master, dev]
    # Docs-only commits (README edits, screenshots, the docs site itself)
    # cannot affect the build — the docs deploy workflow handles them.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, master, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings; skip debuginfo in CI — faster links + less disk than default test/dev profiles.
  RUSTFLAGS: "-D warnings -C debuginfo=0"
  # Kept in sync with rust-toolchain.toml — bump both together.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_INCREMENTAL: "0"
  # Same setting as .cargo/config.toml: skip the OS-level proxy probe in
  # reqwest client builds (stalls seconds on some macOS machines); proxy
  # environment variables are still honored — see KNOWN_ISSUES.md.
  BUZ_HTTP_NO_SYSTEM_PROXY: "1"

concurrency:
  # Only the latest run per branch/tag matters — superseded runs are the
  # norm on rapid pushes, so cancel the older ones instead of queueing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Lightweight + parallel with backend/dashboard: fail-fast on style without waiting
  # for disk cleanup or a full compile.
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Storage boundary: SQL lives only in crates/manager/src/store. The
      # allowlist lists api/ files still migrating and must shrink to empty.
      - name: Store boundary
        run: ./scripts/check_store_boundary.sh

  # ── Backend ────────────────────────────────────────
  backend:
    name: Rust test
    runs-on: ubuntu-latest
    # nextest is new here; a hang must not burn the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Lean cleanup (~30–60s) vs free-disk-space action (often several minutes).
      # Biggest reclaim: Android SDK + .NET + GHC + tool-cache + Docker images.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # Bounded cache (prunes workspace crates / incremental before save).
      # Swatinem/rust-cache removed: one entry (~500MB) alone exceeds the org free-plan storage quota (500MB).

      # Lints are a gate here too, so a release preflight never finds them first.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs the ~130 test binaries in parallel; `cargo test` runs them
      # one after another, and the Manager suites carry many long-poll waits.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      # `cargo nextest run` typechecks + builds; no separate `cargo check`.
      # Doc-tests are outside nextest's scope, so they keep their own step.
      # openssh-server enables the SSH fan-out e2e test (loopback sshd on a
      # high port; three loopback "hosts" are connection params, not machines —
      # concurrency is proven by timing: parallel sleep-2s vs chain-serial).
      - name: Install openssh server
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A

      - name: Run tests
        env:
          BUZ_SSH_E2E: "1"
        run: cargo nextest run --workspace --no-fail-fast

      - name: Run doc-tests
        run: cargo test --doc --workspace

  # ── Postgres backend (feature build) ────────────────────────────────
  # SQLite is the default build; this job proves the `postgres` feature still
  # compiles, that every store statement PREPAREs against the PG schema, and
  # that the hand-written PG bodies behave against a real server (jsonb walks,
  # epoch math, named-conflict upserts).
  postgres:
    name: Rust test (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: buz
          POSTGRES_PASSWORD: buz
          POSTGRES_DB: buz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buz -d buz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BUZ_TEST_PG_URL: postgres://buz:buz@localhost:5432/buz_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: clippy (postgres feature)
        run: cargo clippy -p manager --features postgres --all-targets -- -D warnings

      - name: Postgres store smoke test
        run: cargo test -p manager --features postgres --test pg_smoke_test -- --nocapture

      - name: Postgres journey tests
        run: cargo test -p manager --features postgres --test pg_journey_test -- --nocapture

      - name: Postgres statement compile gate
        run: cargo test -p manager --features postgres --test pg_sql_compile_test -- --nocapture

      - name: Schema parity between SQLite and Postgres
        run: cargo test -p manager --features postgres --test schema_parity_test

      # The dual-backend fixture matrix: every converted suite (incl.
      # slot_scheduling via the guarded host-row reconcile) runs unmodified
      # on Postgres via BUZ_TEST_DB=pg. SQLite-only suites (migration-chain
      # tests, cluster_mode, schema_dump, run_number, rotate_jwt_key,
      # step_resolver) and the pg_* suites are not part of the matrix.
      - name: Fixture matrix (BUZ_TEST_DB=pg)
        run: |
          BUZ_TEST_DB=pg cargo test -p manager --features postgres \
            --test settings_test \
            --test metrics_test \
            --test logs_unit_pagination_test \
            --test log_upload_guard_test \
            --test rerun_test \
            --test sandbox_journey_test \
            --test api_token_test \
            --test approval_race_test \
            --test cancel_delivery_test \
            --test cancel_in_progress_test \
            --test cancel_queue_timeout_test \
            --test cron_scheduler_test \
            --test debug_log_cleanup_test \
            --test debug_trigger_test \
            --test definition_transfer_test \
            --test dispatch_log_mask_test \
            --test environment_approval_test \
            --test environments_test \
            --test git_hooks_update_test \
            --test github_sync_test \
            --test input_validation_trigger_test \
            --test instance_identity_test \
            --test job_log_retention_test \
            --test jobs_stats_test \
            --test ops_sandbox_test \
            --test pipeline_disable_test \
            --test pipeline_env_test \
            --test pipeline_needs_test \
            --test pipeline_scanner_path_test \
            --test pipeline_yaml_files_test \
            --test plugin_library_test \
            --test plugins_library_test \
            --test resource_profile_request_test \
            --test runner_create_test \
            --test runner_reprobe_test \
            --test runner_reregister_test \
            --test runner_restart_test \
            --test runner_standalone_register_test \
            --test runner_terminal_status_test \
            --test sandboxd_config_test \
            --test slot_scheduling_test \
            --test verbose_trigger_test \
            --test version_test \
            --test webhook_environment_test \
            --test yaml_validate_test \
            --test rbac_test \
            --test scan_deprecated_test

      - name: Store SQL validation (postgres feature)
        run: cargo test -p manager --features postgres --test store_sql_validation_test

  # ── Dashboard ───────────────────────────────────────
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
