name: CI

on:
  push:
    branches: [main, master, dev]
    # Docs-only commits (README edits, screenshots, the docs site itself)
    # cannot affect the build — the docs deploy workflow handles them.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, master, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings; skip debuginfo in CI — faster links + less disk than default test/dev profiles.
  RUSTFLAGS: "-D warnings -C debuginfo=0"
  # Kept in sync with rust-toolchain.toml — bump both together.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_INCREMENTAL: "0"
  # Same setting as .cargo/config.toml: skip the OS-level proxy probe in
  # reqwest client builds (stalls seconds on some macOS machines); proxy
  # environment variables are still honored — see KNOWN_ISSUES.md.
  BUZ_HTTP_NO_SYSTEM_PROXY: "1"

concurrency:
  # Only the latest run per branch/tag matters — superseded runs are the
  # norm on rapid pushes, so cancel the older ones instead of queueing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Lightweight + parallel with backend/dashboard: fail-fast on style without waiting
  # for disk cleanup or a full compile.
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Backend ────────────────────────────────────────
  backend:
    name: Rust test
    runs-on: ubuntu-latest
    # nextest is new here; a hang must not burn the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Lean cleanup (~30–60s) vs free-disk-space action (often several minutes).
      # Biggest reclaim: Android SDK + .NET + GHC + tool-cache + Docker images.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # Bounded cache (prunes workspace crates / incremental before save).
      # Swatinem/rust-cache removed: one entry (~500MB) alone exceeds the org free-plan storage quota (500MB).

      # Lints are a gate here too, so a release preflight never finds them first.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs the ~130 test binaries in parallel; `cargo test` runs them
      # one after another, and the Manager suites carry many long-poll waits.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      # `cargo nextest run` typechecks + builds; no separate `cargo check`.
      # Doc-tests are outside nextest's scope, so they keep their own step.
      # openssh-server enables the SSH fan-out e2e test (loopback sshd on a
      # high port; three loopback "hosts" are connection params, not machines —
      # concurrency is proven by timing: parallel sleep-2s vs chain-serial).
      - name: Install openssh server
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A

      - name: Run tests
        env:
          BUZ_SSH_E2E: "1"
        run: cargo nextest run --workspace --no-fail-fast

      - name: Run doc-tests
        run: cargo test --doc --workspace

  # ── Dashboard ───────────────────────────────────────
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
