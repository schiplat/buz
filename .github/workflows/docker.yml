name: Docker / ACR

# Build and push Manager + Runner images to Alibaba Cloud Container Registry (personal).
#
# Required repository configuration:
#   Secrets:
#     ACR_USERNAME          — ACR login username
#     ACR_PASSWORD          — ACR login password / temporary token
#   Variables:
#     ACR_REGISTRY          — e.g. registry.cn-hangzhou.aliyuncs.com
#     ACR_NAMESPACE         — personal namespace
#
# Images:
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-manager:<tag>
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-runner:<tag>

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest, or git tag when on v*)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names & tags
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          REGISTRY="${{ vars.ACR_REGISTRY }}"
          NAMESPACE="${{ vars.ACR_NAMESPACE }}"
          if [[ -z "$REGISTRY" || -z "$NAMESPACE" ]]; then
            echo "Set repository Variables: ACR_REGISTRY and ACR_NAMESPACE" >&2
            exit 1
          fi

          if [[ -n "${INPUT_TAG}" ]]; then
            PRIMARY="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY="${GITHUB_REF_NAME}"
          else
            PRIMARY="latest"
          fi

          MANAGER="${REGISTRY}/${NAMESPACE}/buz-manager"
          RUNNER="${REGISTRY}/${NAMESPACE}/buz-runner"

          {
            echo "${MANAGER}:${PRIMARY}"
            echo "${MANAGER}:latest"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${MANAGER}:${PRIMARY#v}"
            fi
          } > /tmp/tags-manager.txt

          {
            echo "${RUNNER}:${PRIMARY}"
            echo "${RUNNER}:latest"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${RUNNER}:${PRIMARY#v}"
            fi
          } > /tmp/tags-runner.txt

          # docker/build-push-action wants comma-separated or multiline via file
          echo "manager_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-manager.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "runner_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-runner.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "Manager tags:"; cat /tmp/tags-manager.txt
          echo "Runner tags:"; cat /tmp/tags-runner.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push buz-manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.manager_tags }}
          cache-from: type=gha,scope=buz-manager
          cache-to: type=gha,mode=max,scope=buz-manager

      - name: Build & push buz-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: ${{ steps.meta.outputs.runner_tags }}
          cache-from: type=gha,scope=buz-runner
          cache-to: type=gha,mode=max,scope=buz-runner
