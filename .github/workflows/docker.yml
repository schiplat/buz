name: Docker / ACR + Docker Hub

# Build and push Manager + Runner images to two registries:
#   1. Alibaba Cloud Container Registry (personal) — existing deploy channel.
#   2. Docker Hub (official public channel, schiplat namespace).
# Supports linux/amd64 + linux/arm64 (native builds on GitHub-hosted runners,
# no QEMU emulation). Matrix jobs push platform-specific tags
# (vX.Y.Z-amd64 / vX.Y.Z-arm64); a final `merge` job assembles the shared
# multi-arch tags (vX.Y.Z / latest / X.Y.Z) with `buildx imagetools create`.
# Pushing the same tag concurrently from two jobs produces a broken index on
# ACR (arm64 appears as unknown/unknown) — do not revert to that pattern.
#
# Required repository configuration:
#   Secrets:
#     ACR_USERNAME          — ACR login username
#     ACR_PASSWORD          — ACR login password / temporary token
#     DOCKERHUB_USERNAME    — (optional) Docker Hub login; set to ENABLE Docker Hub push
#     DOCKERHUB_TOKEN        — (optional) Docker Hub access token
#   Variables:
#     ACR_REGISTRY          — e.g. registry.cn-hangzhou.aliyuncs.com
#     ACR_NAMESPACE         — personal namespace
#     DOCKERHUB_NAMESPACE   — (optional, default: schiplat)
#
# Images:
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-manager:<tag>  (linux/amd64, linux/arm64)
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-runner:<tag>   (linux/amd64, linux/arm64)
#   ${DOCKERHUB_NAMESPACE}/buz-manager:<tag>            (only when DOCKERHUB_USERNAME is set)
#   ${DOCKERHUB_NAMESPACE}/buz-runner:<tag>             (only when DOCKERHUB_USERNAME is set)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest, or git tag when on v*)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Workflow-level so step `if:` conditions and shell scripts can both probe it.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  push:
    name: Build & push (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - name: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image names & tags
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          REGISTRY="${{ vars.ACR_REGISTRY }}"
          NAMESPACE="${{ vars.ACR_NAMESPACE }}"
          if [[ -z "$REGISTRY" || -z "$NAMESPACE" ]]; then
            echo "Set repository Variables: ACR_REGISTRY and ACR_NAMESPACE" >&2
            exit 1
          fi

          if [[ -n "${INPUT_TAG}" ]]; then
            PRIMARY="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY="${GITHUB_REF_NAME}"
          else
            PRIMARY="latest"
          fi

          # Each matrix job pushes platform-specific tags (e.g. v1.7.3-amd64,
          # latest-arm64). The final multi-arch tags (v1.7.3 / latest / 1.7.3)
          # are assembled in the `merge` job via `buildx imagetools create`;
          # pushing the same tag from two jobs concurrently makes ACR produce a
          # broken index with an unknown/unknown platform entry.
          SUFFIX="${{ matrix.name }}"
          MANAGER="${REGISTRY}/${NAMESPACE}/buz-manager"
          RUNNER="${REGISTRY}/${NAMESPACE}/buz-runner"

          {
            echo "${MANAGER}:${PRIMARY}-${SUFFIX}"
            echo "${MANAGER}:latest-${SUFFIX}"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${MANAGER}:${PRIMARY#v}-${SUFFIX}"
            fi
          } > /tmp/tags-manager.txt

          {
            echo "${RUNNER}:${PRIMARY}-${SUFFIX}"
            echo "${RUNNER}:latest-${SUFFIX}"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${RUNNER}:${PRIMARY#v}-${SUFFIX}"
            fi
          } > /tmp/tags-runner.txt

          # Docker Hub tags are appended only when DOCKERHUB_USERNAME is set,
          # so the workflow keeps working (ACR only) until the secrets exist.
          DH_NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE || 'schiplat' }}"
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            DH_MANAGER="${DH_NAMESPACE}/buz-manager"
            DH_RUNNER="${DH_NAMESPACE}/buz-runner"
            {
              echo "${DH_MANAGER}:${PRIMARY}-${SUFFIX}"
              echo "${DH_MANAGER}:latest-${SUFFIX}"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_MANAGER}:${PRIMARY#v}-${SUFFIX}"
              fi
            } >> /tmp/tags-manager.txt
            {
              echo "${DH_RUNNER}:${PRIMARY}-${SUFFIX}"
              echo "${DH_RUNNER}:latest-${SUFFIX}"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_RUNNER}:${PRIMARY#v}-${SUFFIX}"
              fi
            } >> /tmp/tags-runner.txt
          fi

          # docker/build-push-action wants comma-separated or multiline via file
          echo "manager_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-manager.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "runner_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-runner.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "Manager tags:"; cat /tmp/tags-manager.txt
          echo "Runner tags:"; cat /tmp/tags-runner.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push buz-manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.manager_tags }}
          # Aliyun ACR (personal) rejects the OCI provenance/SBOM attachments
          # buildx emits by default (`unknown manifest class for
          # application/vnd.oci.empty.v1+json`). Disable both.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=buz-manager-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=buz-manager-${{ matrix.name }}

      - name: Build & push buz-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.runner_tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=buz-runner-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=buz-runner-${{ matrix.name }}

  # Assemble the final multi-arch tags from the platform-specific tags pushed by
  # the matrix jobs. A single `buildx imagetools create` writes an index that
  # lists amd64 + arm64 with correct platform metadata.
  merge:
    name: Merge multi-arch manifests
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          REGISTRY="${{ vars.ACR_REGISTRY }}"
          NAMESPACE="${{ vars.ACR_NAMESPACE }}"

          if [[ -n "${INPUT_TAG}" ]]; then
            PRIMARY="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY="${GITHUB_REF_NAME}"
          else
            PRIMARY="latest"
          fi

          TAGS=("${PRIMARY}" "latest")
          if [[ "${PRIMARY}" == v* ]]; then
            TAGS+=("${PRIMARY#v}")
          fi

          for IMG in buz-manager buz-runner; do
            for T in "${TAGS[@]}"; do
              echo "Merging ${REGISTRY}/${NAMESPACE}/${IMG}:${T}"
              docker buildx imagetools create \
                --tag "${REGISTRY}/${NAMESPACE}/${IMG}:${T}" \
                "${REGISTRY}/${NAMESPACE}/${IMG}:${T}-amd64" \
                "${REGISTRY}/${NAMESPACE}/${IMG}:${T}-arm64"
            done
          done

          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            DH_NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE || 'schiplat' }}"
            for IMG in buz-manager buz-runner; do
              for T in "${TAGS[@]}"; do
                echo "Merging ${DH_NAMESPACE}/${IMG}:${T}"
                docker buildx imagetools create \
                  --tag "${DH_NAMESPACE}/${IMG}:${T}" \
                  "${DH_NAMESPACE}/${IMG}:${T}-amd64" \
                  "${DH_NAMESPACE}/${IMG}:${T}-arm64"
              done
            done
          fi

          echo "Merged manifests for ${REGISTRY}/${NAMESPACE}/buz-manager:${PRIMARY}:"
          docker buildx imagetools inspect \
            "${REGISTRY}/${NAMESPACE}/buz-manager:${PRIMARY}"
