name: Docker / ACR + Docker Hub

# Build and push Manager, Runner, and sandboxd images to two registries from
# the RELEASE BINARIES — no compilation. Triggers:
#   1. workflow_run — automatically AFTER the Release workflow completes
#      successfully (its archives carry the prebuilt binaries).
#   2. workflow_dispatch — manual rebuild for an existing tag (`tag` input).
# Platforms: linux/amd64 + linux/arm64, each matrix leg downloading the
# release archive matching its native architecture. Matrix jobs push
# platform-specific tags (vX.Y.Z-amd64 / vX.Y.Z-arm64); the final `merge`
# job assembles the shared multi-arch tags (vX.Y.Z / latest / X.Y.Z) with
# `buildx imagetools create`. Pushing the same tag concurrently from two
# jobs produces a broken index on ACR — do not revert to that pattern.
#
# Base images are ubuntu:24.04 to match the glibc (2.39) of the release
# build runners (ubuntu-latest / ubuntu-24.04-arm).
#
# Required repository configuration:
#   Secrets:
#     ACR_USERNAME          — ACR login username
#     ACR_PASSWORD          — ACR login password / temporary token
#     DOCKERHUB_USERNAME    — (optional) Docker Hub login; set to ENABLE Docker Hub push
#     DOCKERHUB_TOKEN       — (optional) Docker Hub access token
#   Variables:
#     ACR_REGISTRY          — e.g. registry.cn-hangzhou.aliyuncs.com
#     ACR_NAMESPACE         — personal namespace
#     DOCKERHUB_NAMESPACE   — (optional, default: schiplat)
#
# Images:
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-manager:<tag>  (linux/amd64, linux/arm64)
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-runner:<tag>   (linux/amd64, linux/arm64)
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-sandboxd:<tag> (linux/amd64, linux/arm64)
#   ${DOCKERHUB_NAMESPACE}/buz-manager:<tag>            (only when DOCKERHUB_USERNAME is set)
#   ${DOCKERHUB_NAMESPACE}/buz-runner:<tag>             (only when DOCKERHUB_USERNAME is set)
#   ${DOCKERHUB_NAMESPACE}/buz-sandboxd:<tag>           (only when DOCKERHUB_USERNAME is set)

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest, or git tag when on v*)"
        required: false
        default: ""

concurrency:
  # Only the latest run per branch/tag matters — superseded runs are the
  # norm on rapid pushes, so cancel the older ones instead of queueing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Workflow-level so step `if:` conditions and shell scripts can both probe it.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Resolve the image tag and gate on the Release workflow: image builds
  # consume the release binaries, so they only start after a successful
  # release run.
  prepare:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      primary: ${{ steps.resolve.outputs.primary }}
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve image tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_EVENT: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            PRIMARY="${INPUT_TAG}"
          elif [[ "${RELEASE_EVENT}" == "workflow_dispatch" ]]; then
            # A hand-dispatched Release (an existing tag rebuilt after a
            # pipeline fix) carries a branch, not a tag, in head_branch —
            # images for that tag come from dispatching this workflow with
            # tag=<vX.Y.Z> instead of guessing here.
            echo "Release was dispatched by hand — dispatch this workflow with tag=<vX.Y.Z> to (re)build images"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ -n "${RELEASE_BRANCH}" ]]; then
            if [[ "${RELEASE_CONCLUSION}" != "success" ]]; then
              # Images only consume the Linux archives. A release whose other
              # platform jobs died (macOS brownout, cancelled runner) can still
              # ship images as long as both Linux archives are attached.
              VER="${RELEASE_BRANCH#v}"
              ASSETS="$(gh release view "${RELEASE_BRANCH}" --json assets -q '.assets[].name' 2>/dev/null || true)"
              for want in "buz-${VER}-linux-x86_64.tar.gz" "buz-${VER}-linux-aarch64.tar.gz"; do
                if ! grep -qx "${want}" <<<"${ASSETS}"; then
                  echo "Release workflow concluded '${RELEASE_CONCLUSION}' and ${want} is not attached — nothing to package" >&2
                  exit 1
                fi
              done
              echo "Release workflow concluded '${RELEASE_CONCLUSION}', but both Linux archives are attached — packaging"
            fi
            PRIMARY="${RELEASE_BRANCH}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY="${GITHUB_REF_NAME}"
          else
            PRIMARY="latest"
          fi
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "version=${PRIMARY#v}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${PRIMARY} (version ${PRIMARY#v})"

  push:
    name: Build & push (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            release_target: linux-x86_64
          - name: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            release_target: linux-aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image names & tags
        id: meta
        env:
          PRIMARY: ${{ needs.prepare.outputs.primary }}
        run: |
          REGISTRY="${{ vars.ACR_REGISTRY }}"
          NAMESPACE="${{ vars.ACR_NAMESPACE }}"
          if [[ -z "$REGISTRY" || -z "$NAMESPACE" ]]; then
            echo "Set repository Variables: ACR_REGISTRY and ACR_NAMESPACE" >&2
            exit 1
          fi

          # Each matrix job pushes platform-specific tags (e.g. v1.7.3-amd64,
          # latest-arm64). The final multi-arch tags (v1.7.3 / latest / 1.7.3)
          # are assembled in the `merge` job via `buildx imagetools create`;
          # pushing the same tag from two jobs concurrently makes ACR produce a
          # broken index with an unknown/unknown platform entry.
          SUFFIX="${{ matrix.name }}"
          MANAGER="${REGISTRY}/${NAMESPACE}/buz-manager"
          RUNNER="${REGISTRY}/${NAMESPACE}/buz-runner"
          SANDBOXD="${REGISTRY}/${NAMESPACE}/buz-sandboxd"

          {
            echo "${MANAGER}:${PRIMARY}-${SUFFIX}"
            echo "${MANAGER}:latest-${SUFFIX}"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${MANAGER}:${PRIMARY#v}-${SUFFIX}"
            fi
          } > /tmp/tags-manager.txt

          {
            echo "${RUNNER}:${PRIMARY}-${SUFFIX}"
            echo "${RUNNER}:latest-${SUFFIX}"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${RUNNER}:${PRIMARY#v}-${SUFFIX}"
            fi
          } > /tmp/tags-runner.txt

          {
            echo "${SANDBOXD}:${PRIMARY}-${SUFFIX}"
            echo "${SANDBOXD}:latest-${SUFFIX}"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${SANDBOXD}:${PRIMARY#v}-${SUFFIX}"
            fi
          } > /tmp/tags-sandboxd.txt

          # Docker Hub tags are appended only when DOCKERHUB_USERNAME is set,
          # so the workflow keeps working (ACR only) until the secrets exist.
          DH_NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE || 'schiplat' }}"
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            DH_MANAGER="${DH_NAMESPACE}/buz-manager"
            DH_RUNNER="${DH_NAMESPACE}/buz-runner"
            DH_SANDBOXD="${DH_NAMESPACE}/buz-sandboxd"
            {
              echo "${DH_MANAGER}:${PRIMARY}-${SUFFIX}"
              echo "${DH_MANAGER}:latest-${SUFFIX}"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_MANAGER}:${PRIMARY#v}-${SUFFIX}"
              fi
            } >> /tmp/tags-manager.txt
            {
              echo "${DH_RUNNER}:${PRIMARY}-${SUFFIX}"
              echo "${DH_RUNNER}:latest-${SUFFIX}"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_RUNNER}:${PRIMARY#v}-${SUFFIX}"
              fi
            } >> /tmp/tags-runner.txt
            {
              echo "${DH_SANDBOXD}:${PRIMARY}-${SUFFIX}"
              echo "${DH_SANDBOXD}:latest-${SUFFIX}"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_SANDBOXD}:${PRIMARY#v}-${SUFFIX}"
              fi
            } >> /tmp/tags-sandboxd.txt
          fi

          # docker/build-push-action wants comma-separated or multiline via file
          echo "manager_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-manager.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "runner_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-runner.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "sandboxd_tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-sandboxd.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "Manager tags:"; cat /tmp/tags-manager.txt
          echo "Runner tags:"; cat /tmp/tags-runner.txt
          echo "Sandboxd tags:"; cat /tmp/tags-sandboxd.txt

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.release_target }}
          REF: ${{ needs.prepare.outputs.primary }}
        run: |
          set -euo pipefail
          mkdir -p release ctx
          gh release download "$REF" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "buz-${VERSION}-${TARGET}.tar.gz" \
            --output "release/archive.tar.gz"
          # The archive wraps everything in a top-level buz-<version>-<target>/
          # directory — strip it so bin/ and conf/ sit at the context root.
          tar -xzf release/archive.tar.gz -C ctx --strip-components=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push buz-manager
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/prebuilt-manager.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.manager_tags }}
          # Aliyun ACR (personal) rejects the OCI provenance/SBOM attachments
          # buildx emits by default (`unknown manifest class for
          # application/vnd.oci.empty.v1+json`). Disable both.
          provenance: false
          sbom: false

      - name: Build & push buz-runner
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/prebuilt-runner.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.runner_tags }}
          provenance: false
          sbom: false

      - name: Build & push buz-sandboxd
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/prebuilt-sandboxd.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.sandboxd_tags }}
          provenance: false
          sbom: false

  # Assemble the final multi-arch tags from the platform-specific tags pushed by
  # the matrix jobs. A single `buildx imagetools create` writes an index that
  # lists amd64 + arm64 with correct platform metadata.
  merge:
    name: Merge multi-arch manifests
    needs: [prepare, push]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch tags
        env:
          PRIMARY: ${{ needs.prepare.outputs.primary }}
        run: |
          set -euo pipefail
          REGISTRY="${{ vars.ACR_REGISTRY }}"
          NAMESPACE="${{ vars.ACR_NAMESPACE }}"

          TAGS=("${PRIMARY}" "latest")
          if [[ "${PRIMARY}" == v* ]]; then
            TAGS+=("${PRIMARY#v}")
          fi

          for IMG in buz-manager buz-runner buz-sandboxd; do
            for T in "${TAGS[@]}"; do
              echo "Merging ${REGISTRY}/${NAMESPACE}/${IMG}:${T}"
              docker buildx imagetools create \
                --tag "${REGISTRY}/${NAMESPACE}/${IMG}:${T}" \
                "${REGISTRY}/${NAMESPACE}/${IMG}:${T}-amd64" \
                "${REGISTRY}/${NAMESPACE}/${IMG}:${T}-arm64"
            done
          done

          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            DH_NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE || 'schiplat' }}"
            for IMG in buz-manager buz-runner buz-sandboxd; do
              for T in "${TAGS[@]}"; do
                echo "Merging ${DH_NAMESPACE}/${IMG}:${T}"
                docker buildx imagetools create \
                  --tag "${DH_NAMESPACE}/${IMG}:${T}" \
                  "${DH_NAMESPACE}/${IMG}:${T}-amd64" \
                  "${DH_NAMESPACE}/${IMG}:${T}-arm64"
              done
            done
          fi

          echo "Merged manifests for ${REGISTRY}/${NAMESPACE}/buz-sandboxd:${PRIMARY}:"
          docker buildx imagetools inspect \
            "${REGISTRY}/${NAMESPACE}/buz-sandboxd:${PRIMARY}"
