name: Release

# Build release binaries (UI embedded in buz-manager) + config tarball.
# Platforms: Linux (x86_64, aarch64) + macOS aarch64.
# macOS Intel (x86_64 / macos-13) temporarily disabled.
# Triggers: version tags (e.g. v1.7.3) or manual workflow_dispatch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_family: linux
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_family: linux
          # Temporarily disabled: macOS Intel (GitHub macos-13 / x86_64-apple-darwin).
          # - name: macos-x86_64
          #   runs-on: macos-13
          #   target: x86_64-apple-darwin
          #   os_family: macos
          - name: macos-aarch64
            runs-on: macos-14
            target: aarch64-apple-darwin
            os_family: macos

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        if: matrix.os_family == 'linux'
        run: |
          set -euo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
            VER="${VER:-0.0.0}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "archive=buz-${VER}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Install Linux build deps
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build binaries
        run: |
          cargo build --locked --release \
            --target ${{ matrix.target }} \
            -p manager -p runner --bin buz-manager --bin buz-runner --bin buz-sandboxd

      - name: Package archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive }}
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive }}
          path: |
            dist/release/${{ steps.meta.outputs.archive }}.tar.gz
            dist/release/${{ steps.meta.outputs.archive }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    # Only attach assets when running on a version tag (v*).
    # workflow_dispatch on a branch still builds artifacts for download.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: artifacts/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
