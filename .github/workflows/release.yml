name: Release

# Build release binaries (UI embedded in buz-manager) + config tarball.
# Platforms: Linux (x86_64, aarch64) + macOS aarch64.
# macOS Intel (x86_64 / macos-13) temporarily disabled.
# Triggers: version tags (e.g. v1.7.3), or manual workflow_dispatch — with `tag` set it rebuilds that existing release and re-attaches its assets (--clobber); without it, a compile-only dry run.
#
# Two independent jobs:
#   build         — buz-manager / buz-runner / buz-sandboxd, packaged with the
#                   config tree (needs the dashboard build, so it is heavier).
#   build-plugin  — buz-plugin alone, packaged as its own asset. Authors need
#                   one small binary; keeping it out of the platform job means
#                   it does not wait on (or repeat) the dashboard build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and re-attach assets (e.g. v2.0.0); empty = compile-only dry run"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The tag assets attach to: the pushed tag, or the `tag` input when an
  # existing release is rebuilt by hand (e.g. after a runner-image fix).
  # Empty on branch dispatches, which then only verify the build compiles.
  RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_family: linux
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_family: linux
          # Temporarily disabled: macOS Intel (GitHub macos-13 / x86_64-apple-darwin).
          # - name: macos-x86_64
          #   runs-on: macos-13
          #   target: x86_64-apple-darwin
          #   os_family: macos
          - name: macos-aarch64
            runs-on: macos-15
            target: aarch64-apple-darwin
            os_family: macos

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Free disk space
        if: matrix.os_family == 'linux'
        run: |
          set -euo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

      - name: Resolve version
        id: meta
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            VER="${RELEASE_TAG#v}"
          else
            VER="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
            VER="${VER:-0.0.0}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "archive=buz-${VER}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Swatinem/rust-cache removed: one entry (~500MB) alone exceeds the org free-plan storage quota (500MB); see KNOWN_ISSUES.md

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Install Linux build deps
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build binaries
        run: |
          cargo build --locked --release \
            --target ${{ matrix.target }} \
            -p manager -p runner --bin buz-manager --bin buz-runner --bin buz-sandboxd

      - name: Package archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive }}
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh

      - name: Attach archives to the GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          # Release assets do not count against the Actions storage quota
          # (artifacts do), so archives attach directly — no artifact round-trip.
          for attempt in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --title "$TAG" --generate-notes >/dev/null 2>&1 || sleep 5
          done
          gh release upload "$TAG" \
            "dist/release/${ARCHIVE}.tar.gz" \
            "dist/release/${ARCHIVE}.tar.gz.sha256" \
            --clobber

  # Authoring toolchain (buz-plugin): same source tree, none of the platform
  # bundle. Skipped uploads still build, so a tag-less run verifies compiles.
  build-plugin:
    name: buz-plugin ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_family: linux
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_family: linux
          # Temporarily disabled: macOS Intel, mirroring the platform matrix.
          # - name: macos-x86_64
          #   runs-on: macos-13
          #   target: x86_64-apple-darwin
          #   os_family: macos
          - name: macos-aarch64
            runs-on: macos-15
            target: aarch64-apple-darwin
            os_family: macos

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Resolve version
        id: meta
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            VER="${RELEASE_TAG#v}"
          else
            VER="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
            VER="${VER:-0.0.0}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "asset=buz-plugin-${VER}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # reqwest pulls native-tls, so Linux needs the OpenSSL headers.
      - name: Install Linux build deps
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build buz-plugin
        run: |
          cargo build --locked --release \
            --target ${{ matrix.target }} \
            -p plugin-cli --bin buz-plugin

      - name: Package buz-plugin
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp "target/${TARGET}/release/buz-plugin" dist/release/buz-plugin
          tar -czf "dist/release/${ASSET}.tar.gz" -C dist/release buz-plugin
          rm -f dist/release/buz-plugin
          cd dist/release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          else
            shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          fi
          ls -lh "${ASSET}.tar.gz" "${ASSET}.tar.gz.sha256"

      - name: Attach buz-plugin to the GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          # Both jobs create-or-find the release concurrently; re-checking on
          # every attempt makes the race harmless.
          for attempt in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --title "$TAG" --generate-notes >/dev/null 2>&1 || sleep 5
          done
          gh release upload "$TAG" \
            "dist/release/${ASSET}.tar.gz" \
            "dist/release/${ASSET}.tar.gz.sha256" \
            --clobber
