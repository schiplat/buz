name: Docker Standalone / ACR + Docker Hub

# Build and push a single arm64 image that contains both Manager and Runner
# (see docker/prebuilt-standalone.Dockerfile) — from the RELEASE BINARIES,
# no compilation. Triggers:
#   1. workflow_run — automatically AFTER the Release workflow completes
#      successfully (its arm64 archive carries the binaries).
#   2. workflow_dispatch — manual rebuild for an existing tag.
# Base ubuntu:24.04 matches the release build runners' glibc.
#
# Required repository configuration (same as docker.yml):
#   Secrets:
#     ACR_USERNAME          — ACR login username
#     ACR_PASSWORD          — ACR login password / temporary token
#     DOCKERHUB_USERNAME    — (optional) Docker Hub login; set to ENABLE Docker Hub push
#     DOCKERHUB_TOKEN        — (optional) Docker Hub access token
#   Variables:
#     ACR_REGISTRY          — e.g. registry.cn-hangzhou.aliyuncs.com
#     ACR_NAMESPACE         — personal namespace
#     DOCKERHUB_NAMESPACE   — (optional, default: schiplat)
#
# Image:
#   ${ACR_REGISTRY}/${ACR_NAMESPACE}/buz-standalone:<tag>  (linux/arm64)
#   ${DOCKERHUB_NAMESPACE}/buz-standalone:<tag>            (only when DOCKERHUB_USERNAME is set)

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest, or git tag when v*)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Workflow-level so step `if:` conditions and shell scripts can both probe it.
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  prepare:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      primary: ${{ steps.resolve.outputs.primary }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve image tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            PRIMARY="${INPUT_TAG}"
          elif [[ -n "${RELEASE_BRANCH}" ]]; then
            if [[ "${RELEASE_CONCLUSION}" != "success" ]]; then
              echo "Release workflow concluded '${RELEASE_CONCLUSION}' — nothing to package" >&2
              exit 1
            fi
            PRIMARY="${RELEASE_BRANCH}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY="${GITHUB_REF_NAME}"
          else
            PRIMARY="latest"
          fi
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "version=${PRIMARY#v}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${PRIMARY} (version ${PRIMARY#v})"

  push:
    name: Build & push buz-standalone (arm64)
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image names & tags
        id: meta
        env:
          PRIMARY: ${{ needs.prepare.outputs.primary }}
        run: |
          set -euo pipefail
          REGISTRY="${{ vars.ACR_REGISTRY }}"
          NAMESPACE="${{ vars.ACR_NAMESPACE }}"
          if [[ -z "$REGISTRY" || -z "$NAMESPACE" ]]; then
            echo "Set repository Variables: ACR_REGISTRY and ACR_NAMESPACE" >&2
            exit 1
          fi

          if [[ -n "${PRIMARY}" ]]; then
            : "${PRIMARY}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY="${GITHUB_REF_NAME}"
          else
            PRIMARY="latest"
          fi

          IMAGE="${REGISTRY}/${NAMESPACE}/buz-standalone"
          {
            echo "${IMAGE}:${PRIMARY}"
            echo "${IMAGE}:latest"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${IMAGE}:${PRIMARY#v}"
            fi
            # Explicit platform suffix for operators who pin -arm64 tags.
            echo "${IMAGE}:${PRIMARY}-arm64"
            echo "${IMAGE}:latest-arm64"
            if [[ "$PRIMARY" == v* ]]; then
              echo "${IMAGE}:${PRIMARY#v}-arm64"
            fi
          } > /tmp/tags-standalone.txt

          # Docker Hub tags are appended only when DOCKERHUB_USERNAME is set,
          # so the workflow keeps working (ACR only) until the secrets exist.
          DH_NAMESPACE="${{ vars.DOCKERHUB_NAMESPACE || 'schiplat' }}"
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            DH_IMAGE="${DH_NAMESPACE}/buz-standalone"
            {
              echo "${DH_IMAGE}:${PRIMARY}"
              echo "${DH_IMAGE}:latest"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_IMAGE}:${PRIMARY#v}"
              fi
              echo "${DH_IMAGE}:${PRIMARY}-arm64"
              echo "${DH_IMAGE}:latest-arm64"
              if [[ "$PRIMARY" == v* ]]; then
                echo "${DH_IMAGE}:${PRIMARY#v}-arm64"
              fi
            } >> /tmp/tags-standalone.txt
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags-standalone.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Standalone tags:"; cat /tmp/tags-standalone.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ctx
          # The arm64 release archive carries both binaries (bin/ +
          # conf/); standalone tomls and the entrypoint come from the repo.
          gh release download "${{ needs.prepare.outputs.primary }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "buz-${VERSION}-linux-aarch64.tar.gz" \
            --output "release/archive.tar.gz"
          tar -xzf release/archive.tar.gz -C ctx --strip-components=1
          cp deploy/conf/manager.standalone.toml ctx/manager.toml
          cp deploy/conf/runner.standalone.toml ctx/runner.toml
          cp deploy/standalone/entrypoint.sh ctx/entrypoint.sh
          chmod 755 ctx/entrypoint.sh

      - name: Build & push buz-standalone
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/prebuilt-standalone.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Aliyun ACR (personal) rejects the OCI provenance/SBOM attachments
          # buildx emits by default (`unknown manifest class for
          # application/vnd.oci.empty.v1+json`). Disable both.
          provenance: false
          sbom: false

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.primary }}"
