# Host templates: deploy/conf/ → mounted to /app/buz/conf/
#
# Same-host:
#   1. export BUZ_JWT_SECRET=$(openssl rand -hex 32)
#   2. docker compose up -d manager
#   3. UI → Runners → New Runner → edit deploy/conf/runner.toml
#   4. docker compose up -d runner
#
# Other host runner:
#   BUZ_RUNNER_CONF=/etc/buz/runner.toml docker compose up -d runner

services:
  manager:
    image: ${BUZ_IMAGE_MANAGER:-buz-manager:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BUZ_PORT:-8080}:8080"
    environment:
      BUZ_JWT_SECRET: ${BUZ_JWT_SECRET:-}
    volumes:
      - ${BUZ_MANAGER_CONF:-./deploy/conf/manager.toml}:/app/buz/conf/manager.toml:ro
      - ${BUZ_MANAGER_DATA:-buz-data}:/app/buz/data
      - ${BUZ_MANAGER_PIPELINES:-buz-pipelines}:/app/buz/pipelines
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  runner:
    image: ${BUZ_IMAGE_RUNNER:-buz-runner:local}
    build:
      context: .
      dockerfile: Dockerfile.runner
    # Same-compose DNS: manager_url = http://manager:8080 in deploy/conf/runner.toml
    depends_on:
      manager:
        condition: service_healthy
      sandboxd:
        condition: service_healthy
        required: false
    volumes:
      - ${BUZ_RUNNER_CONF:-./deploy/conf/runner.toml}:/app/buz/conf/runner.toml:ro
      - ${BUZ_RUNNER_WS_VOLUME:-buz-runner-ws}:/app/buz/workspace
      - ${BUZ_RUNNER_LOGS:-buz-runner-logs}:/app/buz/logs
      - ${BUZ_RUNNER_STATE:-buz-runner-state}:/app/buz/state
      - buz-sandboxd-socket:/run/buz-sandboxd:ro
    restart: unless-stopped
    # Optional host Docker for uses:docker steps:
    # user: root
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    #   - ${BUZ_RUNNER_CONF:-./deploy/conf/runner.toml}:/app/buz/conf/runner.toml:ro
    #   - ${BUZ_RUNNER_WS:-buz-runner-ws}:/app/buz/workspace
    #   - ${BUZ_RUNNER_LOGS:-buz-runner-logs}:/app/buz/logs
    #   - ${BUZ_RUNNER_STATE:-buz-runner-state}:/app/buz/state

  # Optional host-side job sandbox supervisor. Docker socket access is
  # host-root-equivalent: protect this profile/config as a privileged service.
  sandboxd:
    profiles: ["sandbox"]
    image: ${BUZ_IMAGE_SANDBOXD:-buz-sandboxd:local}
    build:
      context: .
      dockerfile: Dockerfile.sandboxd
    user: "0:0"
    environment:
      BUZ_SANDBOXD_WORKSPACE_VOLUME: ${BUZ_RUNNER_WS_VOLUME:-buz-runner-ws}
      BUZ_SANDBOXD_INSTANCE_ID: ${BUZ_SANDBOXD_INSTANCE_ID:-compose-sandboxd}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BUZ_RUNNER_WS_VOLUME:-buz-runner-ws}:/app/buz/workspace
      - buz-sandboxd-socket:/run/buz-sandboxd
      - ./deploy/conf/sandboxd.toml:/app/buz/conf/sandboxd.toml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/buz-sandboxd", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

    restart: unless-stopped

volumes:
  buz-data:
  buz-pipelines:
  buz-runner-ws:
    name: ${BUZ_RUNNER_WS_VOLUME:-buz-runner-ws}
  buz-runner-logs:
  buz-runner-state:
